<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Rosa Mystica</title>
<meta name="description" content="Catalogue + ledger operations hub"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Rosa Mystica — a quiet operations console: catalogue (master products) + ledger (every movement).
   Near-monochrome neutral canvas, one garnet accent, hairline structure, generous space. */
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --surface-2:#F1F1ED; --surface-3:#EBEBE6;
  --ink:#1A1A1D; --muted:#6C6C73; --faint:#9A9AA1;
  --line:#E7E7E1; --line-strong:#D6D6CF;
  --accent:#9B2D4F; --accent-soft:#B14869; --accent-bg:#F8EBEF; --on-accent:#FFFFFF;
  /* categorical series slots — fixed order, never cycled; validated light & dark */
  --s1:#9B2D4F; --s2:#2a78d6; --s3:#eda100; --s4:#6250d6;
  --good:#2F7D5B; --warn:#936717; --bad:#B23A3A;
  --good-bg:#E8F1EC; --warn-bg:#F5EEDD; --bad-bg:#F6E7E7;
  --shadow:0 1px 2px rgba(20,18,22,.04),0 2px 8px rgba(20,18,22,.05);
  --shadow-lift:0 12px 40px rgba(20,18,22,.18);
  --radius:9px; --radius-sm:6px; --rail:232px;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F11; --surface:#17171A; --surface-2:#1D1D21; --surface-3:#242429;
  --ink:#ECECEF; --muted:#9A9AA2; --faint:#6B6B74;
  --line:#26262B; --line-strong:#36363D;
  --accent:#E78AA3; --accent-soft:#D06E8A; --accent-bg:#2A1820; --on-accent:#17171A;
  --s1:#D06E8A; --s2:#3987e5; --s3:#c98500; --s4:#9085e9;
  --good:#5FBF93; --warn:#D7A64E; --bad:#E58A86;
  --good-bg:#15271F; --warn-bg:#272012; --bad-bg:#2A1B1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.4);
  --shadow-lift:0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F0F11; --surface:#17171A; --surface-2:#1D1D21; --surface-3:#242429;
  --ink:#ECECEF; --muted:#9A9AA2; --faint:#6B6B74;
  --line:#26262B; --line-strong:#36363D;
  --accent:#E78AA3; --accent-soft:#D06E8A; --accent-bg:#2A1820; --on-accent:#17171A;
  --s1:#D06E8A; --s2:#3987e5; --s3:#c98500; --s4:#9085e9;
  --good:#5FBF93; --warn:#D7A64E; --bad:#E58A86;
  --good-bg:#15271F; --warn-bg:#272012; --bad-bg:#2A1B1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.4);
  --shadow-lift:0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:9px;padding:6px 10px 14px}
.brand .mk{width:26px;height:26px;flex:none;color:var(--accent)}
.brand .nm{font-weight:600;font-size:15.5px;letter-spacing:-.02em;line-height:1}
.brand .sub{font-size:10.5px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.navitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--muted);font-weight:500;font-size:13.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
.navitem svg{width:17px;height:17px;flex:none;opacity:.85}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--accent-bg);color:var(--accent)}
.navitem.on svg{opacity:1}
.navitem .count{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--faint);background:var(--surface-2);border-radius:20px;padding:1px 7px}
.navitem.on .count{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.railspace{flex:1}
.railfoot{display:flex;gap:6px;align-items:center;padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:6px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:13px 26px}
.topbar h1{font-size:19px}
.topbar .where{font-size:11px;color:var(--faint);letter-spacing:.03em;text-transform:uppercase;margin-bottom:1px}
.topbar .sp{flex:1}
.content{padding:24px 26px 60px;max-width:1240px;width:100%}
.globalsearch{position:relative;min-width:230px}
.globalsearch input{padding-left:30px}
.globalsearch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}

/* type bits */
.eyebrow{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .note{font-size:12px;color:var(--muted)}

/* buttons */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;
  border-radius:var(--radius-sm);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:border-color .12s,background .12s,filter .12s}
.btn:hover{border-color:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger:hover{background:var(--bad-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);height:32px;min-width:32px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500}
.iconbtn:hover{border-color:var(--accent-soft)}
.iconbtn svg{width:15px;height:15px}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.kpis.five{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--surface);padding:15px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05}
.kpi .f{font-size:11px;color:var(--faint)}

/* panel + table */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h3{font-size:14.5px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:500;font-size:11.5px;text-align:left;
  padding:10px 14px;border-bottom:1px solid var(--line-strong);white-space:nowrap;z-index:1;cursor:default}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface-2)}
td .name{font-weight:500}
td .meta{color:var(--faint);font-size:11.5px}
.code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rowact{opacity:0;transition:opacity .12s}
tr:hover .rowact{opacity:1}

/* badges / chips */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.type{background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 20%,var(--line))}
.badge.in{background:var(--good-bg);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.badge.out{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.badge.off{background:var(--surface-2);color:var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.on{background:var(--good)} .dot.no{background:var(--faint)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* filter bar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.field{position:relative;display:flex;align-items:center}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 10px;width:100%}
input.mono,textarea.mono{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:1px;border-color:var(--accent-soft)}
select{cursor:pointer}
.filter{min-width:120px;width:auto}
.search{min-width:220px}
label.lab{font-size:11.5px;font-weight:500;color:var(--muted);display:block;margin-bottom:5px}
.hintrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none}
.switch input{width:auto}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:500;font-size:12px;padding:5px 13px;cursor:pointer;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:13px;box-shadow:var(--shadow-lift);width:100%;max-width:620px;margin:auto}
.modal.wide{max-width:860px}
.modal-h{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-h h3{font-size:16.5px}
.modal-h .code{font-size:12.5px}
.modal-b{padding:20px 22px;display:flex;flex-direction:column;gap:15px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal-f .sp{flex:1}
.x{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.formsec{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:4px}
.err{font-size:12px;color:var(--bad);font-weight:500}
.okmsg{font-size:12px;color:var(--good);font-weight:500}
.warnbox{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:var(--ink)}

/* empty + toast */
.empty{text-align:center;color:var(--muted);padding:54px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty .big{font-size:17px;color:var(--ink);font-weight:600}
.empty svg{width:34px;height:34px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:13px;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:12px}
.toast .ubtn{background:none;border:none;color:var(--bg);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0}
/* persistent bar — a save that did not happen must not be a silent condition */
.savebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 26px;background:var(--bad-bg);border-bottom:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--bad);font-size:12.5px;font-weight:500}
.savebar .btn{color:var(--ink)}
.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.hot>i{background:var(--bad)}
textarea.io{font-family:var(--mono);font-size:11.5px;min-height:150px;white-space:pre;overflow:auto;line-height:1.5}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .brand{padding:0 10px 0 4px}.railspace{flex:0}.railfoot{border-top:0;margin:0;padding:0}
  .navitem{width:auto} .navitem .count{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .content,.topbar{padding-left:16px;padding-right:16px}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){ .kpis{grid-template-columns:1fr} .grid2,.grid3{grid-template-columns:1fr} }
.charttip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:7px;box-shadow:var(--shadow-lift);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:860px){.anrow{grid-template-columns:1fr!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   that repeats is grouping. A single separator keeps the meaning it has always had here — a
   decimal mark — so nothing already keyed changes value. Parentheses mean negative. */
const parseNum=v=>{if(v==null)return null;if(typeof v==="number")return isNaN(v)?null:v;
  let s=String(v).trim().replace(/[\s\u00a0\u202f]/g,"").replace(/[€$£]/g,"");
  if(s==="")return null;
  let neg=false;if(/^\(.+\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>=0&&ld>=0){if(lc>ld)s=s.replace(/\./g,"").replace(/,/g,".");else s=s.replace(/,/g,"");}
  else if(lc>=0){s=(s.split(",").length>2)?s.replace(/,/g,""):s.replace(",",".");}
  else if(ld>=0&&s.split(".").length>2)s=s.replace(/\./g,"");
  const n=parseFloat(s);return isNaN(n)?null:(neg?-n:n);};
const eur=new Intl.NumberFormat("fi-FI",{style:"currency",currency:"EUR"});
const money=n=>(n==null||isNaN(n))?"—":eur.format(n);
const num=n=>(n==null||isNaN(n))?"—":new Intl.NumberFormat("fi-FI").format(n);
const pct=n=>(n==null||isNaN(n))?"—":new Intl.NumberFormat("fi-FI",{style:"percent",minimumFractionDigits:1,maximumFractionDigits:1}).format(n);
const fmtD=s=>{if(!s)return"—";const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));return m?(m[3]+"."+m[2]+"."+m[1]):String(s);};
const today=()=>new Date().toISOString().slice(0,10);
const TYPES=[["goods","Goods"],["book","Book"],["other","Other"]];
const typeLabel=t=>{const f=TYPES.find(x=>x[0]===t);return f?f[1]:(t||"—");};

/* ---------- persistence ---------- */
const SCHEMA=4;const LSKEY="rosamystica:v1";const LSBUDGET=5000000;
function blankState(){return {schema:SCHEMA,catalogue:[],ledger:[],staging:[],finance:[],postage:[],invoices:[],
  channels:[{id:uid(),name:"Purchase",dir:"in",mode:null,kind:null}],
  settings:{shop:"Katolinen Kirjakauppa",theme:"system",vatRates:{book:13.5,goods:25.5,other:0},lastExport:"",codePrefix:"KKG"}};}
function inferMode(name){const n=String(name||"").toLowerCase();if(/woo|online|verkko|webshop|nettikaup|internet/.test(n))return "online";if(/vektori|shop|myym|kassa|till|counter|store|pos|liike/.test(n))return "in_person";return null;}
function migrate(s){if(!s||typeof s!=="object")return blankState();
  s.schema=SCHEMA;s.catalogue=s.catalogue||[];s.ledger=s.ledger||[];s.staging=s.staging||[];s.finance=s.finance||[];s.postage=s.postage||[];s.invoices=s.invoices||[];
  if(!s.channels||!s.channels.length)s.channels=[{id:uid(),name:"Purchase",dir:"in",mode:null}];
  s.channels=s.channels.map(c=>{const o=("mode" in c)?c:Object.assign({},c,{mode:(c.dir==="out"?inferMode(c.name):null)});
    return ("kind" in o)?o:Object.assign({},o,{kind:(o.dir==="out"?"sale":null)});});
  s.settings=Object.assign({shop:"Katolinen Kirjakauppa",theme:"system"},s.settings||{});
  if(!s.settings.vatRates||typeof s.settings.vatRates!=="object")s.settings.vatRates={book:13.5,goods:25.5,other:0};
  if(!s.settings.codePrefix)s.settings.codePrefix="KKG";
  return s;}
/* Loading returns {ok:true,state} or {ok:false,raw,err}. A payload we cannot read is NEVER
   replaced by a blank state — the raw bytes are handed to the recovery screen, and nothing
   is written until the shopkeeper chooses what to do with them. */
function loadState(){let raw=null;
  try{raw=localStorage.getItem(LSKEY);}catch(e){return {ok:false,raw:null,err:"This browser is not allowing local storage ("+((e&&e.message)||"blocked")+")."};}
  if(raw==null||raw==="")return {ok:true,state:blankState()};
  let o=null;try{o=JSON.parse(raw);}catch(e){return {ok:false,raw,err:"The saved data is not readable JSON — "+((e&&e.message)||"parse error")+"."};}
  if(!o||typeof o!=="object"||Array.isArray(o))return {ok:false,raw,err:"The saved data is not a Rosa Mystica state object."};
  if(!Array.isArray(o.catalogue)&&!Array.isArray(o.ledger))return {ok:false,raw,err:"The saved data carries neither a catalogue nor a ledger — it may belong to another app."};
  try{return {ok:true,state:migrate(o)};}catch(e){return {ok:false,raw,err:"The saved data could not be upgraded — "+((e&&e.message)||"error")+"."};}}
function fmtBytes(n){return n>=1048576?(n/1048576).toFixed(2)+" MB":(n>=1024?Math.round(n/1024)+" KB":n+" B");}
/* save reports what happened — a refused write is never swallowed. */
function save(s){let json;
  try{json=JSON.stringify(s);}catch(e){return {ok:false,bytes:0,msg:"The data could not be prepared for saving."};}
  try{localStorage.setItem(LSKEY,json);return {ok:true,bytes:json.length};}
  catch(e){const q=/quota|exceed/i.test(String((e&&(e.name+" "+e.message))||""));
    return {ok:false,bytes:json.length,quota:q,
      msg:q?("Out of browser storage — nothing has been saved since. "+fmtBytes(json.length)+" needed, about "+fmtBytes(LSBUDGET)+" available."):("The browser refused to save ("+((e&&e.name)||"error")+") — nothing has been saved since.")};}}
function storageInfo(){let bytes=0;try{bytes=(localStorage.getItem(LSKEY)||"").length;}catch(e){}
  return {bytes,budget:LSBUDGET,pct:Math.min(100,Math.round((bytes/LSBUDGET)*1000)/10)};}

/* core file (portable, optionally encrypted) */
const APP="Rosa Mystica";
function makeCore(s){return {app:APP,kind:"core",schema:SCHEMA,savedAt:new Date().toISOString(),data:{catalogue:s.catalogue,ledger:s.ledger,staging:s.staging,finance:s.finance,postage:s.postage,invoices:s.invoices,channels:s.channels,settings:s.settings}};}
function readCore(o){return (o&&o.kind==="core"&&o.data)?o.data:o;}
function isCoreLike(raw){const d=readCore(raw);return !!(d&&(Array.isArray(d.catalogue)||Array.isArray(d.ledger)));}
const HAS_CRYPTO=(typeof crypto!=="undefined")&&!!(crypto.subtle)&&(typeof TextEncoder!=="undefined");
const KDF_ITER=250000;
function ab2b64(buf){const b=new Uint8Array(buf);let s="";const CH=0x8000;for(let i=0;i<b.length;i+=CH)s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));return btoa(s);}
function b642ab(s){const bin=atob(s),len=bin.length,out=new Uint8Array(len);for(let i=0;i<len;i++)out[i]=bin.charCodeAt(i);return out;}
async function deriveKey(pass,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),{name:"PBKDF2"},false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function encryptCore(s,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pass,salt,KDF_ITER);const plain=new TextEncoder().encode(JSON.stringify(makeCore(s)));
  const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain);
  return {app:APP,kind:"core-encrypted",schema:SCHEMA,savedAt:new Date().toISOString(),kdf:"PBKDF2-SHA256",iter:KDF_ITER,salt:ab2b64(salt),iv:ab2b64(iv),cipher:ab2b64(cipher)};}
async function decryptCore(obj,pass){const key=await deriveKey(pass,b642ab(obj.salt),obj.iter||KDF_ITER);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b642ab(obj.iv)},key,b642ab(obj.cipher));return JSON.parse(new TextDecoder().decode(plain));}
function isEncrypted(o){return !!(o&&o.kind==="core-encrypted"&&o.cipher);}
let IN_FRAME=false;try{IN_FRAME=window.self!==window.top;}catch(e){IN_FRAME=true;}
function downloadText(filename,text,type){try{const blob=new Blob([text],{type:type||"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},0);return true;}catch(e){return false;}}
function csvEscape(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}
function toCSV(head,rows){return [head.map(csvEscape).join(",")].concat(rows.map(r=>r.map(csvEscape).join(","))).join("\n");}
function xmlEsc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>c==="&"?"&amp;":c==="<"?"&lt;":"&gt;");}
function colLetter(n){let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function sheetXml(rows){let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  for(let ri=0;ri<rows.length;ri++){const row=rows[ri]||[];x+='<row r="'+(ri+1)+'">';
    for(let ci=0;ci<row.length;ci++){const v=row[ci];const ref=colLetter(ci)+(ri+1);
      if(typeof v==="number"&&isFinite(v)){x+='<c r="'+ref+'"><v>'+v+'</v></c>';}
      else{const t=xmlEsc(v);if(t==="")continue;x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+t+'</t></is></c>';}}
    x+='</row>';}
  return x+'</sheetData></worksheet>';}

  files["_rels/.rels"]='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  files["xl/workbook.xml"]='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>'<sheet name="'+xmlEsc((s.name||("Sheet"+(i+1))).slice(0,31).replace(/[\\\/\*\?\[\]:]/g," "))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+'</sheets></workbook>';
  files["xl/_rels/workbook.xml.rels"]='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'</Relationships>';

function Modal({title,code,wide,onClose,footer,children}){
  useEffect(()=>{const h=e=>{if(e.key==="Escape")onClose();};window.addEventListener("keydown",h);return ()=>window.removeEventListener("keydown",h);},[]);
  return html`<div class="scrim" onMouseDown=${e=>{if(e.target===e.currentTarget)onClose();}}>
    <div class=${"modal"+(wide?" wide":"")}>
      <div class="modal-h"><div style=${{display:"flex",alignItems:"baseline",gap:"10px",flexWrap:"wrap"}}><h3>${title}</h3>${code?html`<span class="code">${code}</span>`:null}</div><button class="x" onClick=${onClose}>×</button></div>
      <div class="modal-b">${children}</div>
      ${footer?html`<div class="modal-f">${footer}</div>`:null}
    </div></div>`;}

function Field({label,children}){return html`<div><label class="lab">${label}</label>${children}</div>`;}
function Badge({dir}){return html`<span class=${"badge "+(dir==="in"?"in":"out")}>${dir==="in"?"In":"Out"}</span>`;}

/* ===================== Overview ===================== */
function Overview({st,go}){
  const stock=useMemo(()=>stockByCode(st),[st]);
  const cat=st.catalogue;const byCode=useMemo(()=>indexCatalogue(cat),[cat]);
  let onHand=0,stockVal=0,withStock=0;
  for(const k in stock){const q=stock[k];if(q>0)withStock++;onHand+=q;const p=byCode[k];if(p&&p.cost)stockVal+=q*(+p.cost||0);}
  const sellable=cat.filter(p=>p.sellable!==false).length;const online=cat.filter(p=>p.online).length;
  const recent=[...st.ledger].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,8);
  return html`<div class="content">
    <div class="rowbetween" style=${{marginBottom:"18px"}}><div><h2 style=${{fontSize:"22px",marginTop:"2px"}}>The hub at a glance</h2></div></div>
    <div class="kpis" style=${{marginBottom:"20px"}}>
      <div class="kpi"><div class="k">Catalogue</div><div class="v">${num(cat.length)}</div><div class="f">${num(sellable)} sellable · ${num(online)} online</div></div>
      <div class="kpi"><div class="k">On hand</div><div class="v">${num(onHand)}</div><div class="f">${num(withStock)} codes in stock</div></div>
      <div class="kpi"><div class="k">Stock value</div><div class="v">${money(stockVal)}</div><div class="f">at catalogue cost</div></div>
      <div class="kpi"><div class="k">Ledger</div><div class="v">${num(st.ledger.length)}</div><div class="f">${num(st.staging.length)} in staging</div></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Recent movements</h3><button class="btn sm ghost" onClick=${()=>go("ledger")}>Open ledger →</button></div>
      ${recent.length===0?html`<div class="empty"><${Icon} name="ledger"/><div class="big">No movements yet</div><div class="note">Record a purchase in the Ledger, or import one.</div></div>`:
      html`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Channel</th><th>Code</th><th>Product</th><th class="num">Qty</th><th class="num">Unit price</th><th>Batch</th></tr></thead>
      <tbody>${recent.map(r=>{const p=byCode[normCode(r.code)];return html`<tr key=${r.id}>
        <td class="mono">${fmtD(r.date)}</td><td><${Badge} dir=${r.dir}/> <span class="muted" style=${{marginLeft:"4px"}}>${r.channel}</span></td>
        <td class="code">${r.code||"—"}</td><td>${p?html`<span class="name">${p.name}</span>`:html`<span class="faint">unlinked</span>`}</td>
        <td class="num">${num(r.qty)}</td><td class="num mono">${r.unitPrice==null?"—":money(r.unitPrice)}</td><td class="code">${r.batchRef||"—"}</td></tr>`;})}</tbody></table></div>`}
    </div>
  </div>`;}

/* ===================== Catalogue ===================== */
function Catalogue({st,act,openProduct,q,setQ}){
  const [ftype,setFtype]=useState("");const [fsell,setFsell]=useState("");const [fonline,setFonline]=useState("");
  const [sort,setSort]=useState({k:"name",d:1});
  const stock=useMemo(()=>stockByCode(st),[st]);const lastOrd=useMemo(()=>lastOrderedByCode(st),[st]);
  const ql=q.trim().toLowerCase();
  let rows=st.catalogue.filter(p=>{
    if(ftype&&p.type!==ftype)return false;
    if(fsell==="yes"&&p.sellable===false)return false;if(fsell==="no"&&p.sellable!==false)return false;
    if(fonline==="yes"&&!p.online)return false;if(fonline==="no"&&p.online)return false;
    if(ql&&![p.code,p.name,p.author,p.category,p.supplier].join(" ").toLowerCase().includes(ql))return false;
    return true;});
  const val=(p,k)=>{if(k==="stock")return stock[normCode(p.code)]||0;if(k==="last")return lastOrd[normCode(p.code)]||"";if(k==="cost"||k==="price")return +p[k]||0;return String(p[k]==null?"":p[k]).toLowerCase();};
  rows=[...rows].sort((a,b)=>{const x=val(a,sort.k),y=val(b,sort.k);return (x<y?-1:x>y?1:0)*sort.d;});
  const S=k=>setSort(s=>s.k===k?{k,d:-s.d}:{k,d:1});
  const arrow=k=>sort.k===k?html`<span class="faint"> ${sort.d>0?"↑":"↓"}</span>`:null;
  const Th=(k,label,cls)=>html`<th class=${"sortable"+(cls?" "+cls:"")} onClick=${()=>S(k)}>${label}${arrow(k)}</th>`;
  return html`<div class="content">
    <div class="rowbetween" style=${{marginBottom:"16px"}}><div><h2 style=${{fontSize:"22px",marginTop:"2px"}}>Products</h2></div>
      <div class="hintrow">${st.catalogue.length?html`<button class="btn" onClick=${()=>act.openRecode()}>Re-code…</button>`:null}<button class="btn" onClick=${()=>act.openCatImport()}><${Icon} name="upload"/>Import catalogue</button><button class="btn primary" onClick=${()=>openProduct(null)}><${Icon} name="plus"/>New product</button></div></div>
    <div class="toolbar">
      <div class="field search globalsearch"><${Icon} name="search"/><input type="text" placeholder="Search code, name, author…" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
      <select class="filter" value=${ftype} onChange=${e=>setFtype(e.target.value)}><option value="">All types</option>${TYPES.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select>
      <select class="filter" value=${fsell} onChange=${e=>setFsell(e.target.value)}><option value="">Sellable: all</option><option value="yes">Sellable</option><option value="no">Not sellable</option></select>
      <select class="filter" value=${fonline} onChange=${e=>setFonline(e.target.value)}><option value="">Online: all</option><option value="yes">Online</option><option value="no">Offline</option></select>
      <span class="sp" style=${{flex:1}}></span><span class="note">${rows.length} of ${st.catalogue.length}</span>
    </div>
    <div class="panel"><div class="tablewrap"><table><thead><tr>
      ${Th("code","Code")}${Th("name","Name")}${Th("type","Type")}${Th("category","Category")}
      ${Th("cost","Cost","num")}${Th("price","Price","num")}${Th("stock","On hand","num")}${Th("last","Last ordered")}<th>Flags</th></tr></thead>
      <tbody>${rows.map(p=>{const k=normCode(p.code);return html`<tr key=${k} class="clickable" onClick=${()=>openProduct(p)}>
        <td class="code">${p.code}</td>
        <td><span class="name">${p.name||"(unnamed)"}</span>${p.author?html`<div class="meta">${p.author}${p.year?" · "+p.year:""}</div>`:null}</td>
        <td><span class="badge type">${typeLabel(p.type)}</span></td><td class="muted">${p.category||"—"}</td>
        <td class="num mono">${p.cost==null||p.cost===""?"—":money(+p.cost)}</td><td class="num mono">${p.price==null||p.price===""?"—":money(+p.price)}</td>
        <td class="num">${num(stock[k]||0)}</td><td class="mono muted">${lastOrd[k]?fmtD(lastOrd[k]):"—"}</td>
        <td><span class="pill"><span class=${"dot "+(p.sellable!==false?"on":"no")} title=${p.sellable!==false?"Sellable":"Not sellable"}></span>${p.online?html`<span class="badge" style=${{padding:"1px 6px"}}>online</span>`:null}</span></td></tr>`;})}
      ${rows.length===0?html`<tr><td colSpan="9"><div class="empty"><${Icon} name="catalogue"/><div class="big">${st.catalogue.length===0?"The catalogue is empty":"Nothing matches"}</div><div class="note">${st.catalogue.length===0?"Add a product, or confirm items from staging after a ledger import.":"Adjust the filters or search."}</div>${st.catalogue.length===0?html`<button class="btn primary" onClick=${()=>openProduct(null)}><${Icon} name="plus"/>New product</button>`:null}</div></td></tr>`:null}
      </tbody></table></div></div>
  </div>`;}

/* secure, atomic product editor — product code is the unique anchor */
function ProductModal({st,act,editing,fromStaging,onClose,show}){
  const orig=editing||{};const origCode=editing?editing.code:null;
  const blank={code:"",type:"goods",name:"",author:"",year:"",category:"",supplier:"",supplierRef:"",cost:"",price:"",sellable:true,online:false,reorderPoint:"",notes:""};
  const [f,setF]=useState(()=>Object.assign({},blank,editing||{},
    (fromStaging&&editing?{supplier:editing.provider||"",supplierRef:editing.providerRef||""}:{}),
    {cost:editing&&editing.cost!=null?String(editing.cost):"",price:editing&&editing.price!=null?String(editing.price):"",reorderPoint:editing&&editing.reorderPoint!=null?String(editing.reorderPoint):""}));
  const up=(k,v)=>setF(o=>({...o,[k]:v}));
  const byCode=useMemo(()=>indexCatalogue(st.catalogue),[st.catalogue]);
  const nc=normCode(f.code);
  const stockHere=editing?(stockByCode(st)[normCode(origCode)]||0):0;
  // validation (whole-form, before any commit)
  const errs=[];
  if(!nc)errs.push("A product code is required — it is the unique anchor.");
  const clash=nc&&byCode[nc]&&normCode(origCode)!==nc;
  if(clash)errs.push("Code "+f.code.trim()+" already exists in the catalogue.");
  if(!String(f.name).trim())errs.push("A name is required.");
  if(f.cost!==""&&parseNum(f.cost)==null)errs.push("Cost must be a number.");
  if(f.price!==""&&parseNum(f.price)==null)errs.push("Price must be a number.");
  const codeChanged=editing&&normCode(origCode)!==nc;
  const relinkN=codeChanged?st.ledger.filter(r=>normCode(r.code)===normCode(origCode)).length:0;
  const valid=errs.length===0;
  function commit(){if(!valid)return;
    const clean={code:f.code.trim(),type:f.type,name:f.name.trim(),author:f.author.trim(),year:String(f.year).trim(),
      category:f.category.trim(),supplier:f.supplier.trim(),supplierRef:(f.supplierRef||"").trim(),cost:f.cost===""?null:parseNum(f.cost),price:f.price===""?null:parseNum(f.price),
      sellable:!!f.sellable,online:!!f.online,reorderPoint:f.reorderPoint===""?null:parseNum(f.reorderPoint),notes:f.notes.trim()};
    act.commitProduct(clean,origCode,fromStaging);
    show(editing?"Product saved":"Product added");onClose();}
  const canType=TYPES;
  const footer=html`<${React.Fragment}>
    ${editing&&!fromStaging?html`<button class="btn danger" onClick=${()=>{if(stockHere!==0){show("Can't delete — "+stockHere+" on hand / ledger movements exist");return;}const n=st.ledger.filter(r=>normCode(r.code)===normCode(origCode)).length;if(n>0){show("Can't delete — "+n+" ledger movements reference this code");return;}act.deleteProduct(origCode);show("Product deleted",true);onClose();}}>Delete</button>`:null}
    <span class="sp"></span>
    <button class="btn" onClick=${onClose}>Cancel</button>
    <button class="btn primary" onClick=${commit} disabled=${!valid}>${fromStaging?"Confirm into catalogue":(editing?"Save changes":"Add product")}</button>
  </${React.Fragment}>`;
  return html`<${Modal} title=${fromStaging?"Confirm staged item":(editing?"Edit product":"New product")} code=${editing?editing.code:null} onClose=${onClose} footer=${footer}>
    ${fromStaging?html`<div class="warnbox">This item came from a ledger import and isn't in the catalogue yet. Complete its details and confirm — the product code stays the anchor.</div>`:null}
    <div class="grid3">
      <${Field} label="Product code *">${html`<div style=${{display:"flex",gap:"6px"}}>
        <input class="mono" type="text" value=${f.code} onInput=${e=>up("code",e.target.value)} placeholder="SKU / EAN / ISBN"/>
        <button class="btn sm" style=${{flex:"none"}} title="Take the next free code in your own scheme — the supplier's code stays in Provider ref" onClick=${()=>up("code",nextFreeCode(st))}>Next</button></div>`}</${Field}>
      <${Field} label="Type">${html`<select value=${f.type} onChange=${e=>up("type",e.target.value)}>${canType.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select>`}</${Field}>
      <${Field} label="Category">${html`<input type="text" value=${f.category} onInput=${e=>up("category",e.target.value)} placeholder="e.g. Rosary, Theology"/>`}</${Field}>
    </div>
    <${Field} label="Name *">${html`<input type="text" value=${f.name} onInput=${e=>up("name",e.target.value)}/>`}</${Field}>
    ${f.type==="book"?html`<div class="grid2">
      <${Field} label="Author">${html`<input type="text" value=${f.author} onInput=${e=>up("author",e.target.value)}/>`}</${Field}>
      <${Field} label="Year">${html`<input type="text" value=${f.year} onInput=${e=>up("year",e.target.value)}/>`}</${Field}>
    </div>`:null}
    <div class="grid2">
      <${Field} label="Cost (net) €">${html`<input class="mono" type="text" inputmode="decimal" value=${f.cost} onInput=${e=>up("cost",e.target.value)}/>`}</${Field}>
      <${Field} label="Price (incl VAT) €">${html`<input class="mono" type="text" inputmode="decimal" value=${f.price} onInput=${e=>up("price",e.target.value)}/>`}</${Field}>
    </div>
    <div class="grid2">
      <${Field} label="Supplier / provider">${html`<input type="text" value=${f.supplier} onInput=${e=>up("supplier",e.target.value)}/>`}</${Field}>
      <${Field} label="Provider ref (their code)">${html`<input class="mono" type="text" value=${f.supplierRef} onInput=${e=>up("supplierRef",e.target.value)} placeholder="bridge to their invoice"/>`}</${Field}>
    </div>
    <div class="hintrow" style=${{gap:"18px"}}>
      <label class="switch"><input type="checkbox" checked=${!!f.sellable} onChange=${e=>up("sellable",e.target.checked)}/> Sellable</label>
      <label class="switch"><input type="checkbox" checked=${!!f.online} onChange=${e=>up("online",e.target.checked)}/> Online</label>
    </div>
    <${Field} label="Reorder point (blank = reorder only when out of stock)">${html`<input class="mono" type="text" inputmode="numeric" value=${f.reorderPoint} onInput=${e=>up("reorderPoint",e.target.value)}/>`}</${Field}>
    <${Field} label="Notes">${html`<input type="text" value=${f.notes} onInput=${e=>up("notes",e.target.value)}/>`}</${Field}>
    ${codeChanged&&relinkN>0?html`<div class="warnbox">Changing the code will relink <b>${relinkN}</b> ledger movement${relinkN>1?"s":""} from <span class="code">${origCode}</span> to <span class="code">${f.code.trim()}</span> in one atomic step.</div>`:null}
    ${errs.length?html`<div>${errs.map((e,i)=>html`<div class="err" key=${i}>• ${e}</div>`)}</div>`:html`<div class="okmsg">Ready to save.</div>`}
  </${Modal}>`;}

/* ===================== Ledger ===================== */
function Ledger({st,act,openMovement,openProduct}){
  const [fch,setFch]=useState("");const [fbatch,setFbatch]=useState("");const [q,setQ]=useState("");const [group,setGroup]=useState(false);
  const [fFrom,setFFrom]=useState("");const [fTo,setFTo]=useState("");
  const [qd,setQd]=useState("");const [lim,setLim]=useState(200);const [delBatch,setDelBatch]=useState(false);
  /* the search box types freely; filtering runs a beat later so a long ledger doesn't stutter */
  useEffect(()=>{const t=setTimeout(()=>setQd(q),180);return ()=>clearTimeout(t);},[q]);
  useEffect(()=>{setLim(200);},[fch,fbatch,qd,fFrom,fTo,group]);
  const byCode=useMemo(()=>indexCatalogue(st.catalogue),[st.catalogue]);
  const batches=useMemo(()=>[...new Set(st.ledger.map(r=>r.batchRef).filter(Boolean))],[st.ledger]);
  const km=useMemo(()=>kindMap(st),[st.channels]);
  const rows=useMemo(()=>{const ql=qd.trim().toLowerCase();
    const out=st.ledger.filter(r=>{
      if(fch&&r.channel!==fch)return false;if(fbatch&&r.batchRef!==fbatch)return false;
      const d=r.date||"";if(fFrom&&d<fFrom)return false;if(fTo&&d>fTo)return false;
      if(ql){const p=byCode[normCode(r.code)];if(![r.code,r.batchRef,r.note,p&&p.name].join(" ").toLowerCase().includes(ql))return false;}
      return true;});
    out.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||""));
    return out;},[st.ledger,byCode,fch,fbatch,qd,fFrom,fTo]);
  const total=useMemo(()=>rows.reduce((a,r)=>a+(r.dir==="in"?1:-1)*(+r.qty||0),0),[rows]);
  const win=useMemo(()=>rows.slice(0,lim),[rows,lim]);
  function line(r){const p=byCode[normCode(r.code)];const kd=r.dir==="out"?(km[r.channel]||"sale"):null;
    return html`<tr key=${r.id} class="clickable" onClick=${()=>openMovement(r)}>
    <td class="mono">${fmtD(r.date)}</td><td><${Badge} dir=${r.dir}/> <span class="muted" style=${{marginLeft:"4px"}}>${r.channel}</span>${kd&&!isSaleKind(kd)?html`<div class="meta">${KIND_LBL[kd]}</div>`:null}</td>
    <td class="code" onClick=${e=>{if(p){e.stopPropagation();openProduct(p);}}} style=${{cursor:p?"pointer":"default"}}>${r.code||"—"}</td>
    <td>${p?html`<span class="name">${p.name}</span>`:html`<span class="faint">unlinked</span>`}</td>
    <td class="num">${num(r.qty)}</td><td class="num mono">${r.unitPrice==null?"—":money(r.unitPrice)}</td>
    <td class="num mono">${r.unitPrice==null?"—":money((+r.qty||0)*(+r.unitPrice||0))}</td>
    <td class="code">${r.batchRef||"—"}${r.provider?html`<div class="meta">${r.provider}</div>`:null}</td>
    <td class="code">${r.providerRef||"—"}</td>
    <td class="num"><button class="btn sm ghost rowact" onClick=${e=>{e.stopPropagation();act.deleteMovement(r.id);show&&show("Movement deleted",true);}}>Delete</button></td></tr>`;}
  const show=act.toast;
  const grouped=useMemo(()=>{const g={};for(const r of win){const k=r.batchRef||"(no batch)";(g[k]=g[k]||[]).push(r);}return Object.entries(g);},[win]);
  const more=rows.length>win.length?html`<div class="rowbetween" style=${{padding:"10px 14px",borderTop:"1px solid var(--line)"}}>
    <span class="note">Showing ${num(win.length)} of ${num(rows.length)} rows</span>
    <div class="hintrow"><button class="btn sm" onClick=${()=>setLim(l=>l+500)}>Show 500 more</button><button class="btn sm ghost" onClick=${()=>setLim(rows.length)}>Show all</button></div></div>`:null;
  return html`<div class="content">
    <div class="rowbetween" style=${{marginBottom:"16px"}}><div><h2 style=${{fontSize:"22px",marginTop:"2px"}}>Movements</h2></div>
      <div class="hintrow"><button class="btn" onClick=${()=>act.openImport()}><${Icon} name="upload"/>Import ledger</button><button class="btn primary" onClick=${()=>openMovement(null)}><${Icon} name="plus"/>New movement</button></div></div>
    <div class="toolbar">
      <div class="field search globalsearch"><${Icon} name="search"/><input type="text" placeholder="Search code, product, batch, note…" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
      <select class="filter" value=${fch} onChange=${e=>setFch(e.target.value)}><option value="">All channels</option>${st.channels.map(c=>html`<option key=${c.id} value=${c.name}>${c.name}</option>`)}</select>

    html`<div class="panel"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Channel</th><th>Code</th><th>Product</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line</th><th>Batch</th><th>Prov. ref</th><th></th></tr></thead>

function MovementModal({st,act,editing,onClose,show}){
  const blank={id:null,date:today(),channel:st.channels[0]?st.channels[0].name:"Purchase",country:"",provider:"",providerRef:"",batchRef:"",code:"",qty:"",lineTotal:"",vatRate:"",transport:"",note:""};
  const [f,setF]=useState(editing?{...editing,qty:String(editing.qty??""),lineTotal:(editing.unitPrice!=null&&editing.qty)?String(Math.round(editing.unitPrice*editing.qty*100)/100):"",vatRate:(editing.vatRate==null?"":String(editing.vatRate)),transport:(editing.transport==null?"":String(editing.transport))}:blank);
  const up=(k,v)=>setF(o=>({...o,[k]:v}));
  const byCode=useMemo(()=>indexCatalogue(st.catalogue),[st.catalogue]);
  const nc=normCode(f.code);const prod=byCode[nc];
  const errs=[];if(!nc)errs.push("A product code is required.");if(parseNum(f.qty)==null||parseNum(f.qty)===0)errs.push("Quantity must be non-zero (negative allowed, e.g. an opening adjustment or a return).");
  const valid=errs.length===0;
  const suggestedBatch=genBatchRef(f.country,f.date,f.provider);
  function commit(){if(!valid)return;const dir=channelDir(st,f.channel);const bref=f.batchRef.trim()||suggestedBatch;
    const qn=parseNum(f.qty)||0;const lt=parseNum(f.lineTotal);const unitPrice=(lt!=null&&qn>0)?(lt/qn):null;const vr=parseNum(f.vatRate);const tr=parseNum(f.transport);
    act.saveMovement({id:f.id,date:f.date||today(),channel:f.channel,dir,batchRef:bref,code:f.code.trim(),qty:qn,unitPrice,vatRate:(vr==null?null:vr),transport:(tr==null?null:tr),note:f.note.trim(),country:(f.country||"").trim(),provider:(f.provider||"").trim(),providerRef:(f.providerRef||"").trim()});
    show(editing?"Movement updated":"Movement recorded");onClose();}
  const codes=st.catalogue.map(p=>p.code).filter(Boolean);
  const footer=html`<${React.Fragment}>${editing?html`<button class="btn danger" onClick=${()=>{act.deleteMovement(editing.id);show("Movement deleted",true);onClose();}}>Delete</button>`:null}<span class="sp"></span><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${commit} disabled=${!valid}>${editing?"Save":"Record"}</button></${React.Fragment}>`;
  return html`<${Modal} title=${editing?"Edit movement":"New movement"} onClose=${onClose} footer=${footer}>
    <div class="grid3">
      <${Field} label="Date">${html`<input type="date" value=${f.date} onInput=${e=>up("date",e.target.value)}/>`}</${Field}>
      <${Field} label="Channel">${html`<select value=${f.channel} onChange=${e=>up("channel",e.target.value)}>${st.channels.map(c=>html`<option key=${c.id} value=${c.name}>${c.name} (${c.dir})</option>`)}</select>`}</${Field}>
      <${Field} label="Batch reference">${html`<input class="mono" type="text" value=${f.batchRef} onInput=${e=>up("batchRef",e.target.value)} placeholder=${suggestedBatch||"shared by one import"}/>`}</${Field}>
    </div>
    <div class="grid3">
      <${Field} label="Country of origin">${html`<input type="text" value=${f.country} onInput=${e=>up("country",e.target.value)}/>`}</${Field}>
      <${Field} label="Provider">${html`<input type="text" value=${f.provider} onInput=${e=>up("provider",e.target.value)}/>`}</${Field}>
      <${Field} label="Provider ref (their code)">${html`<input class="mono" type="text" value=${f.providerRef} onInput=${e=>up("providerRef",e.target.value)}/>`}</${Field}>
    </div>
    ${(f.country||f.provider)&&!f.batchRef.trim()?html`<div class="note" style=${{marginTop:"-8px"}}>Batch ref will auto-generate as <span class="code">${suggestedBatch||"—"}</span></div>`:null}
    <${Field} label="Product code *">${html`<input class="mono" type="text" value=${f.code} onInput=${e=>up("code",e.target.value)} list="rm-codes"/>`}</${Field}>
    <datalist id="rm-codes">${codes.map(c=>html`<option key=${c} value=${c}></option>`)}</datalist>
    <div class="note" style=${{marginTop:"-8px"}}>${nc?(prod?html`Links to <b>${prod.name}</b>`:html`<span class="warn" style=${{color:"var(--warn)"}}>No catalogue product — will record as unlinked.</span>`):"Enter the product code this movement concerns."}</div>
    <div class="grid3">
      <${Field} label="Quantity *">${html`<input class="mono" type="text" inputmode="decimal" value=${f.qty} onInput=${e=>up("qty",e.target.value)}/>`}</${Field}>
      <${Field} label="Line total (incl VAT) €">${html`<input class="mono" type="text" inputmode="decimal" value=${f.lineTotal} onInput=${e=>up("lineTotal",e.target.value)}/>`}</${Field}>
      <${Field} label="VAT % (ALV)">${html`<input class="mono" type="text" inputmode="decimal" value=${f.vatRate} onInput=${e=>up("vatRate",e.target.value)} placeholder="13.5 / 25.5 / 0"/>`}</${Field}>
    </div>
    ${(parseNum(f.lineTotal)!=null&&parseNum(f.qty)>0)?html`<div class="note" style=${{marginTop:"-8px"}}>Unit ${money(parseNum(f.lineTotal)/parseNum(f.qty))}${parseNum(f.vatRate)>0?html` · net ${money(parseNum(f.lineTotal)/(1+parseNum(f.vatRate)/100))} · VAT ${money(parseNum(f.lineTotal)-parseNum(f.lineTotal)/(1+parseNum(f.vatRate)/100))}`:""}</div>`:null}
    ${channelDir(st,f.channel)==="in"?html`<${Field} label="Transport — whole batch, net € (freight-in; enter once per batch, spread per unit)">${html`<input class="mono" type="text" inputmode="decimal" value=${f.transport} onInput=${e=>up("transport",e.target.value)}/>`}</${Field}>`:null}
    <${Field} label="Note">${html`<input type="text" value=${f.note} onInput=${e=>up("note",e.target.value)}/>`}</${Field}>
    ${errs.length?html`<div>${errs.map((e,i)=>html`<div class="err" key=${i}>• ${e}</div>`)}</div>`:null}
  </${Modal}>`;}

/* ===================== Settings ===================== */
function Settings({st,act,show}){
  const [newCh,setNewCh]=useState({name:"",dir:"out",mode:"",kind:"sale"});
  const sinfo=storageInfo();const lastExp=st.settings.lastExport||"";
  const [pfx,setPfx]=useState(()=>st.settings.codePrefix||"KKG");
  const vrs=st.settings.vatRates||{book:13.5,goods:25.5,other:0};
  const [vr,setVr]=useState(()=>({book:String(vrs.book??13.5),goods:String(vrs.goods??25.5),other:String(vrs.other??0)}));
  const fileRef=useRef();
  function exportCore(){const txt=JSON.stringify(makeCore(st),null,2);const name="rosa-mystica_core_"+today()+".json";
    act.markExport();
    if(IN_FRAME||!downloadText(name,txt)){act.openExport("Core data — copy and keep safe",txt);}else show("Saved "+name);}
  function exportCatalogueCSV(){const head=["code","type","name","author","year","category","supplier","supplierRef","cost","price","sellable","online","reorderPoint","notes"];
    const rows=st.catalogue.map(p=>[p.code,p.type,p.name,p.author,p.year,p.category,p.supplier,p.supplierRef||"",p.cost,p.price,p.sellable!==false,!!p.online,p.reorderPoint==null?"":p.reorderPoint,p.notes]);
    const csv=toCSV(head,rows);if(IN_FRAME||!downloadText("rosa-mystica_catalogue_"+today()+".csv",csv,"text/csv"))act.openExport("Catalogue — CSV",csv);else show("Saved CSV");}
  function exportLedgerCSV(){const head=["date","channel","dir","batchRef","code","qty","unitPrice","vatRate","lineTotal","transport","note"];
    const rows=st.ledger.map(r=>[r.date,r.channel,r.dir,r.batchRef,r.code,r.qty,r.unitPrice,r.vatRate==null?"":r.vatRate,(r.unitPrice==null?"":Math.round((+r.qty||0)*(+r.unitPrice||0)*100)/100),r.transport==null?"":r.transport,r.note]);
    const csv=toCSV(head,rows);if(IN_FRAME||!downloadText("rosa-mystica_ledger_"+today()+".csv",csv,"text/csv"))act.openExport("Ledger — CSV",csv);else show("Saved CSV");}
  function onOpen(e){const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(isEncrypted(o)){act.openDecrypt(o);return;}if(!isCoreLike(o))throw 0;act.replaceAll(o);show("Loaded "+file.name);}catch(err){show("Couldn't read that file");}};r.readAsText(file);e.target.value="";}
  const r2=x=>x==null?"":Math.round(x*100)/100;
  function salesSheets(){const km=kindMap(st);const out=st.ledger.filter(r=>r.dir==="out"&&isSaleKind(km[r.channel]));const byCode=indexCatalogue(st.catalogue);const prod={},chan={},month={};
    for(const r of out){const q=+r.qty||0,v=q*(+r.unitPrice||0);const k=normCode(r.code);(prod[k]=prod[k]||{code:r.code,units:0,rev:0});prod[k].units+=q;prod[k].rev+=v;
      const c=r.channel||"—";(chan[c]=chan[c]||{units:0,rev:0});chan[c].units+=q;chan[c].rev+=v;const m=(r.date||"").slice(0,7);if(/^\d{4}-\d{2}$/.test(m)){(month[m]=month[m]||{units:0,rev:0});month[m].units+=q;month[m].rev+=v;}}
    const pr=[["Code","Name","Units","Revenue"]].concat(Object.values(prod).sort((a,b)=>b.rev-a.rev).map(p=>{const nm=byCode[normCode(p.code)];return [p.code,nm?nm.name:"",p.units,r2(p.rev)];}));
    const ch=[["Channel","Units","Revenue"]].concat(Object.entries(chan).sort((a,b)=>b[1].rev-a[1].rev).map(([c,v])=>[c,v.units,r2(v.rev)]));
    const mo=[["Month","Units","Revenue"]].concat(Object.keys(month).sort().map(m=>[m,month[m].units,r2(month[m].rev)]));
    return [{name:"By product",rows:pr},{name:"By channel",rows:ch},{name:"By month",rows:mo}];}
  function invSheets(){const rows=computeInventory(st);const head=["Code","Name","Received","Sold","Not sold (adj.)","Not-sold cost","On hand","Sell-through %","Stock value","Realized profit","ROI %","Provider","Provider ref","Reorder point"];
    const body=rows.slice().sort((a,b)=>b.onHandValue-a.onHandValue).map(r=>[r.code,r.name,r.received,r.sold,r.shrink||0,r2(r.shrinkCost||0),r.onHand,r.sellThrough==null?"":r2(r.sellThrough*100),r2(r.onHandValue),r2(r.realProfit),r.roi==null?"":r2(r.roi*100),r.provider,r.providerRef,r.reorderPoint||0]);
    return [{name:"Inventory",rows:[head].concat(body)}];}
  function catSheets(){const head=["Code","Type","Name","Author","Year","Category","Supplier","Provider ref","Cost","Price","Sellable","Online","Reorder point","Notes"];
    const body=st.catalogue.map(p=>[p.code,p.type,p.name,p.author,p.year,p.category,p.supplier,p.supplierRef||"",p.cost==null?"":+p.cost,p.price==null?"":+p.price,p.sellable!==false?"yes":"no",p.online?"yes":"no",p.reorderPoint==null?"":+p.reorderPoint,p.notes]);
    return [{name:"Catalogue",rows:[head].concat(body)}];}
  function ledSheets(){const head=["Date","Channel","Dir","Batch ref","Country","Provider","Provider ref","Code","Qty","Unit price","VAT %","Line total","Transport (batch)","Note"];
    const body=st.ledger.map(r=>[r.date,r.channel,r.dir,r.batchRef,r.country||"",r.provider||"",r.providerRef||"",r.code,+r.qty||0,r.unitPrice==null?"":+r.unitPrice,r.vatRate==null?"":+r.vatRate,(r.unitPrice==null?"":r2((+r.qty||0)*(+r.unitPrice||0))),r.transport==null?"":+r.transport,r.note]);
    return [{name:"Ledger",rows:[head].concat(body)}];}
  return html`<div class="content" style=${{maxWidth:"780px"}}>
    <div style=${{marginBottom:"16px"}}><h2 style=${{fontSize:"22px",marginTop:"2px"}}>Configuration</h2></div>
    <div class="panel" style=${{marginBottom:"18px"}}>
      <div class="panel-h"><h3>Channels</h3><span class="note">direction drives stock · mode splits in-person / online · kind decides what counts as a sale</span></div>
      <div class="tablewrap"><table><tbody>
        ${st.channels.map(c=>html`<tr key=${c.id}><td><span class="name">${c.name}</span></td><td style=${{width:"96px"}}><${Badge} dir=${c.dir}/></td>
          <td style=${{width:"150px"}}>${c.dir==="out"?html`<select value=${c.mode||""} onChange=${e=>act.setChannelMode(c.id,e.target.value)}><option value="">— unset —</option><option value="in_person">In-person</option><option value="online">Online</option></select>`:html`<span class="faint">—</span>`}</td>
          <td style=${{width:"150px"}}>${c.dir==="out"?html`<select value=${c.kind||"sale"} onChange=${e=>act.setChannelKind(c.id,e.target.value)}>${KINDS.map(k=>html`<option key=${k[0]} value=${k[0]}>${k[1]}</option>`)}</select>`:html`<span class="faint">—</span>`}</td>
          <td class="num" style=${{width:"90px"}}>${st.channels.length>1?html`<button class="btn sm ghost" onClick=${()=>{if(st.ledger.some(r=>r.channel===c.name)){show("Channel is used by ledger rows");return;}act.removeChannel(c.id);}}>Remove</button>`:null}</td></tr>`)}
        <tr><td><input type="text" placeholder="New channel name" value=${newCh.name} onInput=${e=>setNewCh(o=>({...o,name:e.target.value}))}/></td>
          <td><select value=${newCh.dir} onChange=${e=>setNewCh(o=>({...o,dir:e.target.value}))}><option value="in">In (stock +)</option><option value="out">Out (stock −)</option></select></td>
          <td>${newCh.dir==="out"?html`<select value=${newCh.mode} onChange=${e=>setNewCh(o=>({...o,mode:e.target.value}))}><option value="">— unset —</option><option value="in_person">In-person</option><option value="online">Online</option></select>`:html`<span class="faint">—</span>`}</td>
          <td>${newCh.dir==="out"?html`<select value=${newCh.kind} onChange=${e=>setNewCh(o=>({...o,kind:e.target.value}))}>${KINDS.map(k=>html`<option key=${k[0]} value=${k[0]}>${k[1]}</option>`)}</select>`:html`<span class="faint">—</span>`}</td>
          <td class="num"><button class="btn sm primary" disabled=${!newCh.name.trim()} onClick=${()=>{act.addChannel(newCh.name.trim(),newCh.dir,newCh.mode,newCh.kind);setNewCh({name:"",dir:"out",mode:"",kind:"sale"});}}>Add</button></td></tr>
      </tbody></table></div>
    </div>
    <div class="panel" style=${{marginBottom:"18px"}}>
      <div class="panel-h"><h3>VAT rates by type</h3><span class="note">net margin & sale-VAT stripping</span></div>
      <div style=${{padding:"16px"}}>
        <div class="grid3">
          <${Field} label="Book %">${html`<input class="mono" type="text" inputmode="decimal" value=${vr.book} onInput=${e=>setVr(o=>({...o,book:e.target.value}))} onBlur=${()=>act.setVatRate("book",vr.book)}/>`}</${Field}>
          <${Field} label="Goods %">${html`<input class="mono" type="text" inputmode="decimal" value=${vr.goods} onInput=${e=>setVr(o=>({...o,goods:e.target.value}))} onBlur=${()=>act.setVatRate("goods",vr.goods)}/>`}</${Field}>
          <${Field} label="Other %">${html`<input class="mono" type="text" inputmode="decimal" value=${vr.other} onInput=${e=>setVr(o=>({...o,other:e.target.value}))} onBlur=${()=>act.setVatRate("other",vr.other)}/>`}</${Field}>
        </div>
        <div class="note" style=${{marginTop:"10px"}}>Sales are stripped to net at the rate for each product's type when computing margin; a movement's own VAT % overrides. Purchases carry their own per-line VAT %, keyed with the VAT-inclusive total.</div>
        <div class="rowbetween" style=${{marginTop:"14px",borderTop:"1px solid var(--line)",paddingTop:"13px",gap:"12px"}}>
          <div><div class="lab">Code prefix for new products</div>
            <div class="note">The <b>Next</b> button on a product offers the next free code in this scheme — currently <span class="code">${nextFreeCode(st)}</span>.</div></div>
          <input class="mono" type="text" style=${{width:"110px"}} value=${pfx} onInput=${e=>setPfx(e.target.value)} onBlur=${()=>act.setCodePrefix(pfx)}/>

/* ===================== Invoices (draft → checked → posted) =====================
   A supplier invoice is entered as a draft: a header (who, when, which tax treatment, what
   freight and duty), then its lines. Nothing touches stock until the draft reconciles to the
   total printed on the invoice and you post it — at which point the lines become ordinary
   ledger in-movements under one batch reference, exactly as a file import would. */
const TREATMENTS=[
  ["domestic","Domestic (Finland)","VAT is on the invoice; net is counted back from each line total."],
  ["eu_acq","Intra-EU acquisition","0% on the invoice — you self-account the Finnish VAT and deduct it. The line total is already net."],
  ["import","Import (outside EU)","0% on the invoice. Duty and clearance are landed cost; import VAT is deductible, so it never enters stock value."],
  ["own","Own print","Service-fee VAT on the total, as the printer bills it."]];
const TREAT_LBL={};TREATMENTS.forEach(t=>{TREAT_LBL[t[0]]=t[1];});
const EU=["at","austria","be","belgium","bg","bulgaria","hr","croatia","cy","cyprus","cz","czechia","czech republic","dk","denmark","ee","estonia","fi","finland","suomi","fr","france","ranska","de","germany","saksa","gr","greece","hu","hungary","ie","ireland","it","italy","italia","lv","latvia","lt","lithuania","lu","luxembourg","mt","malta","nl","netherlands","alankomaat","pl","poland","puola","pt","portugal","portugali","ro","romania","sk","slovakia","si","slovenia","es","spain","espanja","se","sweden","ruotsi"];
/* A sensible default only — the shopkeeper can always override it on the invoice. */
function treatmentForCountry(c){const n=String(c||"").trim().toLowerCase();if(!n)return "eu_acq";
  if(/^(fi|finland|suomi)$/.test(n))return "domestic";
  return EU.indexOf(n)>=0?"eu_acq":"import";}
function defaultVatFor(treatment,st){const vr=vatRatesOf(st);
  if(treatment==="domestic")return vr.goods;if(treatment==="own")return vr.goods;return 0;}
/* An invoice number makes the best batch reference; keep it filterable. */
function refFromInvoiceNo(s){return String(s||"").trim().toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-|-$/g,"");}
function blankInvoice(st){const c="";return {id:uid(),status:"draft",provider:"",country:c,invoiceNo:"",
  date:today(),due:"",currency:"EUR",rate:"1",treatment:treatmentForCountry(c),
  freight:"",freightVat:"",duty:"",importVat:"",vatDefault:"",invoiceTotal:"",note:"",lines:[],batchRef:"",postedAt:""};}
function blankLine(){return {id:uid(),supplierRef:"",code:"",name:"",qty:"",qtyRecv:"",lineTotal:"",vatRate:"",type:"goods"};}
const r2=x=>Math.round(x*100)/100;
function invoiceTotals(inv){
  let lines=0,units=0,recv=0,missing=0;
  for(const l of (inv.lines||[])){
    const t=parseNum(l.lineTotal);if(t==null)missing++;else lines+=t;
    const q=parseNum(l.qty)||0;units+=q;
    const rq=(l.qtyRecv===""||l.qtyRecv==null)?q:(parseNum(l.qtyRecv)||0);recv+=rq;}
  const freight=parseNum(inv.freight)||0,duty=parseNum(inv.duty)||0,importVat=parseNum(inv.importVat)||0;
  /* Freight is keyed exactly as the invoice shows it — VAT and all, on a domestic invoice — so the
     gate can compare like with like against the printed total. Only its NET part is capitalised:
     deductible VAT has no business in stock value. */
  const fv=parseNum(inv.freightVat);const freightNet=(fv&&fv>0)?freight/(1+fv/100):freight;
  const computed=lines+freight+duty;const keyed=parseNum(inv.invoiceTotal);
  return {lines:r2(lines),units,recv,missing,freight,freightNet:r2(freightNet),duty,importVat,
    spread:r2(freightNet+duty),computed:r2(computed),keyed,
    diff:keyed==null?null:r2(computed-keyed),landed:r2(computed),
    ok:keyed!=null&&Math.abs(computed-keyed)<0.005};}
/* Catalogue indexed by the supplier's own article number. The first invoice from a provider
   teaches this map (you set the code when confirming staging); every later invoice from them
   resolves straight onto your codes with no staging at all. */
/* A line's VAT: its own value, else the product's statutory rate when we know the product and
   the invoice is domestic, else the invoice default, else the treatment's. */
function lineVatFor(l,inv,st,byCode){
  const own=parseNum(l&&l.vatRate);if(own!=null)return own;
  const p=byCode?byCode[normCode(l&&l.code)]:null;
  if(inv.treatment==="domestic"&&p)return saleRateFor(p,st);
  const hd=parseNum(inv.vatDefault);if(hd!=null)return hd;
  return defaultVatFor(inv.treatment,st);}
function normRef(s){return String(s||"").replace(/[\s\-_.\/]/g,"").toUpperCase();}
function normProv(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")
  .replace(/(lda|oy|ab|gmbh|srl|sarl|bv|nv|spa|sa|ltd|llc|inc|unipessoal)$/,"");}
function supplierIndex(st){const byPair={},byRef={},refSeen={};
  for(const p of (st.catalogue||[])){const r=normRef(p.supplierRef);if(!r)continue;
    const pv=normProv(p.supplier);if(pv)byPair[pv+"|"+r]=p.code;
    refSeen[r]=(refSeen[r]||0)+1;byRef[r]=p.code;}
  return {lookup(provider,ref){const r=normRef(ref);if(!r)return null;
    const pv=normProv(provider);
    if(pv&&byPair[pv+"|"+r])return byPair[pv+"|"+r];
    if(pv)for(const k in byPair){const kp=k.split("|");if(kp[1]!==r)continue;
      if(kp[0]===pv||(kp[0].length>=3&&pv.length>=3&&(kp[0].indexOf(pv)===0||pv.indexOf(kp[0])===0)))return byPair[k];}
    return (refSeen[r]===1)?byRef[r]:null;}};}
/* Next free code in the shop's own scheme, e.g. KKG-142. */
function nextFreeCode(st){const pre=((st.settings&&st.settings.codePrefix)||"KKG").toUpperCase();
  const re=new RegExp("^"+pre.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"-(\\d+)$","i");
  let max=0,width=3;
  for(const p of (st.catalogue||[])){const m=re.exec(String(p.code||"").trim());if(!m)continue;
    const n=+m[1];if(n>max)max=n;if(m[1].length>width)width=m[1].length;}
  return pre+"-"+String(max+1).padStart(width,"0");}
/* Pasted supplier text: rows on newlines, columns on tabs, semicolons or runs of spaces. */
function splitPaste(text){const rows=[];
  for(const raw of String(text||"").split(/\r?\n/)){const ln=raw.replace(/\s+$/,"");if(!ln.trim())continue;
    let parts=ln.indexOf("\t")>=0?ln.split("\t"):(ln.indexOf(";")>=0&&ln.split(";").length>2?ln.split(";"):ln.split(/\s{2,}/));
    parts=parts.map(x=>x.trim()).filter((x,i,a)=>!(x===""&&(i===0||i===a.length-1)));
    if(parts.length>1)rows.push(parts);}
  return rows;}
const PASTE_FIELDS=[["skip","— skip —"],["supplierRef","Supplier ref"],["code","Our code"],["name","Description"],
  ["qty","Quantity"],["qtyRecv","Received"],["unit","Unit price"],["lineTotal","Line total"],["vatRate","VAT %"]];
function guessPasteMap(rows){
  const w=Math.max(...rows.map(r=>r.length));const map=new Array(w).fill("skip");
  const numeric=i=>rows.filter(r=>r[i]!=null&&parseNum(r[i])!=null&&/\d/.test(String(r[i]))).length/rows.length>0.7;
  const nums=[];for(let i=0;i<w;i++)if(numeric(i))nums.push(i);
  for(let i=0;i<w;i++)if(!numeric(i)){map[i]="supplierRef";break;}
  let named=false;
  for(let i=0;i<w;i++)if(!numeric(i)&&map[i]==="skip"&&!named){map[i]="name";named=true;}
  if(nums.length>=2){map[nums[0]]="qty";map[nums[nums.length-1]]="lineTotal";}
  else if(nums.length===1)map[nums[0]]="qty";
  return map;}

function Invoices({st,act,show,openProduct}){
  const drafts=(st.invoices||[]);
  const [sel,setSel]=useState(null);
  const [paste,setPaste]=useState("");const [pasteRows,setPasteRows]=useState(null);const [pmap,setPmap]=useState([]);
  const [confirmPost,setConfirmPost]=useState(false);const [confirmUnpost,setConfirmUnpost]=useState(null);
  const inv=sel?drafts.find(d=>d.id===sel):null;
  const idx=useMemo(()=>supplierIndex(st),[st.catalogue]);
  const byCode=useMemo(()=>indexCatalogue(st.catalogue),[st.catalogue]);
  const t=inv?invoiceTotals(inv):null;
  const upd=patch=>act.saveInvoice(Object.assign({},inv,patch));
  const updLine=(id,patch)=>upd({lines:inv.lines.map(l=>l.id===id?Object.assign({},l,patch):l)});
  function setRef(l,v){const patch={supplierRef:v};
    if(!l.code){const hit=idx.lookup(inv.provider,v);if(hit)patch.code=hit;}
    updLine(l.id,patch);}
  function addLines(rows,map){const add=[];
    for(const r of rows){const o=blankLine();let any=false;
      map.forEach((f,i)=>{if(f==="skip"||r[i]==null)return;const v=String(r[i]).trim();if(!v)return;any=true;
        if(f==="qty"||f==="qtyRecv"||f==="lineTotal"||f==="vatRate"||f==="unit"){const n=parseNum(v);if(n==null)return;
          if(f==="unit")o._unit=n;else o[f]=String(n);}
        else o[f]=v;});
      if(o._unit!=null&&!o.lineTotal&&parseNum(o.qty)!=null)o.lineTotal=String(r2(o._unit*parseNum(o.qty)));
      delete o._unit;
      if(!any||(!o.supplierRef&&!o.code&&!o.name))continue;
      if(!o.code&&o.supplierRef){const hit=idx.lookup(inv.provider,o.supplierRef);if(hit)o.code=hit;}
      add.push(o);}
    if(!add.length){show("Nothing to add from that paste");return;}
    upd({lines:inv.lines.concat(add)});setPaste("");setPasteRows(null);
    const matched=add.filter(l=>l.code).length;
    show("Added "+add.length+" line"+(add.length>1?"s":"")+(matched?" · "+matched+" matched to existing products":""));}
  /* Give every unmatched line a code in the shop's own scheme, continuing past anything already
     taken in the catalogue or sitting in another draft. The supplier's reference stays on the
     line, which is what teaches the map for their next invoice. */
  function allocCodes(){const pre=((st.settings&&st.settings.codePrefix)||"KKG").toUpperCase();
    const used=new Set((st.catalogue||[]).map(p=>normCode(p.code)));
    (st.invoices||[]).forEach(d=>(d.lines||[]).forEach(l=>{if(l.code)used.add(normCode(l.code));}));
    const m=/^(.*)-(\d+)$/.exec(nextFreeCode(st));let n=m?+m[2]:1;const width=m?m[2].length:3;
    let given=0;

      let c;do{c=pre+"-"+String(n++).padStart(width,"0");}while(used.has(normCode(c)));
      used.add(normCode(c));given++;return Object.assign({},l,{code:c});});
    upd({lines});show("Gave our codes to "+given+" line"+(given>1?"s":""));}
  const postable=inv&&inv.status==="draft"&&t&&t.ok&&inv.lines.length>0&&
    inv.lines.every(l=>(l.code||l.supplierRef)&&(parseNum(l.qty)||0)>0&&parseNum(l.lineTotal)!=null);
  const treatNote=(TREATMENTS.find(x=>x[0]===(inv&&inv.treatment))||["","",""])[2];

  function list(){
    const rows=drafts.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    return html`<${React.Fragment}>
    <div class="rowbetween" style=${{marginBottom:"16px"}}><h2 style=${{fontSize:"22px"}}>Invoices</h2>

    <div class="note" style=${{marginBottom:"14px",maxWidth:"660px"}}>Enter a supplier invoice here before it reaches the ledger: the header carries the tax treatment, the freight and any duty; the lines carry what you were billed and what actually arrived. Posting is blocked until the draft agrees with the total printed on the invoice.</div>
    ${rows.length===0?html`<div class="panel"><div class="empty"><${Icon} name="invoice"/><div class="big">No invoices yet</div><div class="note" style=${{maxWidth:"430px"}}>Start one when the invoice arrives; finish it when the goods land. Quantity invoiced and quantity received are separate columns, so a short delivery is recorded as you unpack it.</div><button class="btn primary" onClick=${()=>{const n=blankInvoice(st);act.saveInvoice(n);setSel(n.id);}}><${Icon} name="plus"/>New invoice</button></div></div>`:

          ${postable?html`<span class="note" style=${{color:"var(--good)"}}>✓ ready to post${t.recv!==t.units?" · "+num(t.recv)+" of "+num(t.units)+" units":""}</span>`:null}
        </div>
        ${!posted?html`<div class="note" style=${{marginTop:"10px"}}>Posting creates ${num(inv.lines.length)} in-movements under batch <span class="code">${refFromInvoiceNo(inv.invoiceNo)||genBatchRef(inv.country,inv.date,inv.provider)||"(auto)"}</span>. Codes not in the catalogue go to staging, as with any import.</div>`:null}

    ${confirmPost?html`<${ConfirmModal} title="Post this invoice to the ledger?" confirmLabel=${"Post "+num(inv.lines.length)+" lines"}
      body=${html`<span>This writes <b>${num(inv.lines.length)}</b> in-movements totalling <b>${money(t.landed)}</b> landed, under batch <span class="code">${refFromInvoiceNo(inv.invoiceNo)||genBatchRef(inv.country,inv.date,inv.provider)}</span>. Stock rises by ${num(t.recv)} units. The invoice stays here as a record, and can be unposted.</span>`}

/* A file of invoice lines becomes one draft per invoice reference. The header is taken from the
   group's first line and its freight from the Transport column; the printed total is deliberately
   left BLANK, so the gate still has to be satisfied against the paper invoice rather than against
   the archive that produced the file. */
function rowsToInvoices(rows,st){
  const m=mapLedgerRows(rows,st);
  const groups={},order=[];
  for(const r of m.raw){
    if(r.dir!=="in")continue;
    const key=r.batchRef||genBatchRef(r.country,r.date,r.provider)||"(no reference)";
    if(!groups[key]){groups[key]={id:uid(),status:"draft",provider:r.provider||"",country:r.country||"",
      invoiceNo:key,date:r.date||today(),due:"",currency:"EUR",rate:"1",
      treatment:treatmentForCountry(r.country),vatDefault:"",freight:"",freightVat:"",duty:"",importVat:"",
      invoiceTotal:"",note:"",lines:[],batchRef:"",postedAt:""};order.push(key);}
    const g=groups[key];
    if(r.transport!=null&&+r.transport>0&&!g.freight)g.freight=String(r.transport);
    if(!g.provider&&r.provider)g.provider=r.provider;
    if(!g.country&&r.country)g.country=r.country;
    if(r.date&&r.date<g.date)g.date=r.date;
    g.lines.push({id:uid(),supplierRef:r.providerRef||"",code:r.code||"",name:r._name||r.note||"",
      qty:String(r.qty),qtyRecv:"",lineTotal:String(Math.round(r.qty*(+r.unitPrice||0)*100)/100),
      vatRate:(r.vatRate==null?"":String(r.vatRate)),type:r._type||"goods"});}
  const list=order.map(k=>groups[k]);
  for(const inv of list){
    /* no country stated but the lines carry VAT — that is a domestic purchase */
    if(!inv.country&&inv.lines.some(l=>(parseNum(l.vatRate)||0)>0))inv.treatment="domestic";
    else inv.treatment=treatmentForCountry(inv.country);
    inv.vatDefault=String(defaultVatFor(inv.treatment,st));
    inv.freightVat=String(inv.treatment==="domestic"?defaultVatFor("domestic",st):0);}
  return {invoices:list,skipped:m.skipped,warnings:m.warnings,col:m.col};}

      <div class="kpis" style=${{marginTop:"4px"}}>

/* Bulk re-code: download the catalogue as a sheet with an empty New code column, fill in the ones
   you want changed, upload it back. Blank rows are left alone. Every change is shown — including
   how many ledger movements and draft lines will follow the code — before anything is written. */
function RecodeModal({st,act,onClose,show}){
  const [res,setRes]=useState(null);const [err,setErr]=useState("");const [fn,setFn]=useState("");const fileRef=useRef();
  function dl(){const head=["Product code","Name","Author","Type","Supplier","Supplier ref","On hand","New code"];
    const stock=stockByCode(st);
    const rows=st.catalogue.slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""))).
      map(p=>[p.code,p.name||"",p.author||"",p.type||"",p.supplier||"",p.supplierRef||"",stock[normCode(p.code)]||0,""]);
    downloadXlsx("Rosa-Mystica_Re-code-template.xlsx",[{name:"Re-code",rows:[head].concat(rows)}],show);}
  function ingest(rows){
    if(!rows||!rows.length){setErr("The file looks empty.");return;}
    const H=(rows[0]||[]).map(normH);
    const ci=H.findIndex(h=>h==="productcode"||h==="code"||h==="oldcode");
    const ni=H.findIndex(h=>h==="newcode"||h==="newproductcode");
    if(ci<0||ni<0){setErr("Need a 'Product code' column and a 'New code' column — download the template.");setRes(null);return;}
    const byCode=indexCatalogue(st.catalogue);
    const pairs=[],problems=[];const taken={};let blank=0,same=0;
    const catTaken={};for(const p of st.catalogue)catTaken[normCode(p.code)]=p.code;
    for(let i=1;i<rows.length;i++){const r=rows[i]||[];
      const from=String(r[ci]==null?"":r[ci]).trim();const to=String(r[ni]==null?"":r[ni]).trim();
      if(!from&&!to)continue;
      if(!to){blank++;continue;}
      const p=byCode[normCode(from)];
      if(!p){problems.push("Row "+(i+1)+": “"+from+"” is not in the catalogue.");continue;}
      if(normCode(to)===normCode(from)){same++;continue;}
      if(taken[normCode(to)]){problems.push("Row "+(i+1)+": “"+to+"” is used twice in this file.");continue;}
      if(catTaken[normCode(to)]&&normCode(catTaken[normCode(to)])!==normCode(from)){
        problems.push("Row "+(i+1)+": “"+to+"” already belongs to another product ("+catTaken[normCode(to)]+").");continue;}
      taken[normCode(to)]=1;
      const moves=st.ledger.filter(x=>normCode(x.code)===normCode(from)).length;
      const dls=(st.invoices||[]).reduce((a,inv)=>a+(inv.lines||[]).filter(l=>normCode(l.code)===normCode(from)).length,0);
      pairs.push({from:p.code,to,name:p.name||"",moves,dls});}
    setRes({pairs,problems,blank,same});
    setErr(pairs.length?"":(problems.length?"Nothing can be applied until the problems below are fixed.":"No new codes filled in — the New code column is empty on every row."));}
  function onFile(e){const f=e.target.files&&e.target.files[0];if(!f)return;setErr("");setRes(null);setFn(f.name);
    const nm=(f.name||"").toLowerCase();const rd=new FileReader();rd.onerror=()=>setErr("Couldn't read the file.");
    if(nm.endsWith(".csv")){rd.onload=()=>{try{ingest(csvParse(String(rd.result)));}catch(x){setErr("Couldn't parse that CSV.");}};rd.readAsText(f);}
    else{rd.onload=()=>{try{ingest(xlsxToRows(rd.result));}catch(x){setErr("Couldn't read that .xlsx.");}};rd.readAsArrayBuffer(f);}
    e.target.value="";}
  const ok=res&&res.pairs.length&&!res.problems.length;
  function run(){if(!ok)return;act.recodeProducts(res.pairs.map(p=>({from:p.from,to:p.to})));
    show("Re-coded "+res.pairs.length+" product"+(res.pairs.length>1?"s":""),true);onClose();}
  return html`<${Modal} wide=${true} title="Re-code products" onClose=${onClose}
    footer=${html`<${React.Fragment}><span class="sp"></span><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${run} disabled=${!ok}>Re-code ${ok?res.pairs.length:""}</button></${React.Fragment}>`}>
    <div class="note">Change product codes in bulk — moving to EAN numbers, say. Download the catalogue, fill in <b>New code</b> only for the ones you want changed, and upload it back: blank rows are left exactly as they are. Renaming carries the product's whole history with it — every ledger movement and every invoice draft line follows the code.</div>
    <div class="hintrow">
      <button class="btn" onClick=${dl}><${Icon} name="download"/>Download template · ${num(st.catalogue.length)} products</button>
      <button class="btn" onClick=${()=>fileRef.current&&fileRef.current.click()}><${Icon} name="upload"/>Upload filled file…</button>
      <input ref=${fileRef} type="file" accept=".xlsx,.csv" style=${{display:"none"}} onChange=${onFile}/>${fn?html`<span class="note">${fn}</span>`:null}</div>
    ${err?html`<div class="err">${err}</div>`:null}
    ${res?html`<${React.Fragment}>
      <div class="kpis" style=${{marginTop:"4px"}}>
        <div class="kpi"><div class="k">To re-code</div><div class="v">${num(res.pairs.length)}</div></div>
        <div class="kpi"><div class="k">Movements relinked</div><div class="v">${num(res.pairs.reduce((a,p)=>a+p.moves,0))}</div></div>
        <div class="kpi"><div class="k">Left alone</div><div class="v">${num(res.blank+res.same)}</div><div class="f">${num(res.blank)} blank · ${num(res.same)} unchanged</div></div>
        <div class="kpi"><div class="k">Problems</div><div class="v" style=${{color:res.problems.length?"var(--bad)":"inherit"}}>${num(res.problems.length)}</div></div>
      </div>
      ${res.problems.length?html`<div class="err" style=${{marginTop:"10px",lineHeight:"1.6"}}>${res.problems.slice(0,12).map((w,i)=>html`<div key=${i}>⚠ ${w}</div>`)}${res.problems.length>12?html`<div>…and ${num(res.problems.length-12)} more</div>`:null}</div>`:null}
      ${res.pairs.length?html`<div class="tablewrap" style=${{marginTop:"12px",maxHeight:"280px",overflow:"auto"}}><table><thead><tr><th>Old code</th><th>New code</th><th>Product</th><th class="num">Movements</th><th class="num">Draft lines</th></tr></thead>
        <tbody>${res.pairs.slice(0,200).map(p=>html`<tr key=${p.from}><td class="code faint">${p.from}</td><td class="code">${p.to}</td><td><span class="name">${p.name}</span></td><td class="num">${num(p.moves)}</td><td class="num">${p.dls?num(p.dls):"—"}</td></tr>`)}</tbody></table></div>`:null}
      ${res.pairs.length>200?html`<div class="note">Showing the first 200 of ${num(res.pairs.length)}.</div>`:null}
    </${React.Fragment}>`:null}
  </${Modal}>`;}
