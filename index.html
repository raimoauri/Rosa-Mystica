function LedgerImportModal({st,act,onClose,show}){
  const [res,setRes]=useState(null);const [err,setErr]=useState("");const [fn,setFn]=useState("");const fileRef=useRef();
  function ingest(rows){const r=parseLedgerRows(rows,st);setRes(r);setErr(r.stats.add?"":(r.stats.dup?("All "+r.stats.dup+" row"+(r.stats.dup>1?"s are":" is")+" already in the ledger — nothing new to add."):"No movements found — check the file uses the ledger template."));}
  function onFile(e){const f=e.target.files&&e.target.files[0];if(!f)return;setErr("");setRes(null);setFn(f.name);const name=(f.name||"").toLowerCase();const rd=new FileReader();rd.onerror=()=>setErr("Couldn't read the file.");

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WDAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function wdOf(iso){if(!/^\d{4}-\d{2}-\d{2}/.test(String(iso||"")))return"";const d=new Date(String(iso).slice(0,10)+"T00:00:00Z");return isNaN(d)?"":WDAYS[d.getUTCDay()];}
function monLbl(k){const p=String(k).split("-");return (MONTHS[(+p[1])-1]||"?")+" ’"+(p[0]||"").slice(2);}
function niceTicks(max,count){max=Math.max(max,1);const s0=max/Math.max(1,count);const mag=Math.pow(10,Math.floor(Math.log10(s0)));const nm=s0/mag;let st2;if(nm<=1)st2=mag;else if(nm<=2)st2=2*mag;else if(nm<=5)st2=5*mag;else st2=10*mag;const out=[];for(let v=0;v<=max+1e-9;v+=st2)out.push(Math.round(v*1000)/1000);return out;}
/* Shared period resolution — Analytics and Finance offer the same presets and mean the same
   thing by them, so a figure in one tab can be compared with a figure in the other. */
const PERIODS=[["all","All data"],["thismonth","This month"],["lastmonth","Last month"],["30","Last 30 days"],["90","Last 90 days"],["ytd","Year to date"],["custom","Custom…"]];
function resolvePeriod(preset,from,to,minD,maxD){
  const monB=(y,m)=>{const last=new Date(Date.UTC(y,m,0)).getUTCDate();return [y+"-"+pad2(m)+"-01",y+"-"+pad2(m)+"-"+pad2(last)];};
  let start=minD,end=maxD;
  if(preset==="custom"){start=from||minD;end=to||maxD;}
  else if(preset==="thismonth"){const t=today();const b=monB(+t.slice(0,4),+t.slice(5,7));start=b[0];end=b[1];}
  else if(preset==="lastmonth"){const t=today();let y=+t.slice(0,4),m=+t.slice(5,7)-1;if(m<1){m=12;y--;}const b=monB(y,m);start=b[0];end=b[1];}
  else if(preset==="ytd"){const t=today();start=t.slice(0,4)+"-01-01";end=t;}
  else if(preset==="30"||preset==="90"){const n=+preset;const d=new Date(today()+"T00:00:00Z");start=new Date(d.getTime()-(n-1)*86400000).toISOString().slice(0,10);end=today();}
  return {start:start||"",end:end||""};}
/* keep a cursor-following tooltip inside the window */
function clampX(x){const w=(typeof window!=="undefined"&&window.innerWidth)||900;return Math.max(96,Math.min(x,w-96));}

function Analytics({st,act,show}){
  const [tip,setTip]=useState(null);const [metric,setMetric]=useState("rev");const [basis,setBasis]=useState("gross");
  const [preset,setPreset]=useState("all");const [from,setFrom]=useState("");const [to,setTo]=useState("");
  const [showAll,setShowAll]=useState(false);
  const tp=label=>({onMouseEnter:e=>setTip({x:e.clientX,y:e.clientY,label}),onMouseMove:e=>setTip({x:e.clientX,y:e.clientY,label}),onMouseLeave:()=>setTip(null)});
  const byCode=useMemo(()=>indexCatalogue(st.catalogue),[st.catalogue]);
  const km=useMemo(()=>kindMap(st),[st.channels]);
  const modeOf=useMemo(()=>{const m={};for(const c of (st.channels||[]))m[c.name]=c.mode||null;return m;},[st.channels]);
  const pal=useMemo(()=>channelPalette(st),[st.channels,st.ledger,st.finance]);
  const outAll=useMemo(()=>st.ledger.filter(r=>r.dir==="out"),[st.ledger]);
  const span=useMemo(()=>{const d=outAll.map(r=>r.date).filter(Boolean).sort();return [d.length?d[0]:"",d.length?d[d.length-1]:""];},[outAll]);
  const per=resolvePeriod(preset,from,to,span[0],span[1]);const start=per.start,end=per.end;
  /* One pass over the out-movements in range. Only sale-kind channels become takings; a
     write-off or correction is tallied separately so it can be seen but never inflates sales. */
  const A=useMemo(()=>{
    const chan={},monthMap={},prod={},modeMap={in_person:{units:0,rev:0},online:{units:0,rev:0},unset:{units:0,rev:0}};
    let units=0,rev=0,lines=0,exUnits=0,exLines=0;
    for(const r of outAll){const d=r.date||"";if(start&&d<start)continue;if(end&&d>end)continue;
      const q=+r.qty||0;const p=byCode[normCode(r.code)];
      const v=q*(basis==="net"?netSaleUnit(r,saleRateFor(p,st)):(+r.unitPrice||0));
      if(!isSaleKind(km[r.channel])){exUnits+=q;exLines++;continue;}
      units+=q;rev+=v;lines++;
      const c=r.channel||"—";(chan[c]=chan[c]||{units:0,rev:0});chan[c].units+=q;chan[c].rev+=v;
      const md=modeOf[r.channel]||"unset";modeMap[md].units+=q;modeMap[md].rev+=v;
      const m=d.slice(0,7);if(/^\d{4}-\d{2}$/.test(m)){(monthMap[m]=monthMap[m]||{units:0,rev:0});monthMap[m].units+=q;monthMap[m].rev+=v;}
      const k=normCode(r.code);(prod[k]=prod[k]||{code:r.code,units:0,rev:0,ch:{}});prod[k].units+=q;prod[k].rev+=v;prod[k].ch[c]=(prod[k].ch[c]||0)+q;}
    return {chan,monthMap,prod,modeMap,units,rev,lines,exUnits,exLines};
  },[outAll,byCode,km,modeOf,start,end,basis,st.settings]);
  const months=Object.keys(A.monthMap).sort().map(k=>Object.assign({k},A.monthMap[k]));
  const channels=pal.order.filter(n=>A.chan[n]).concat(Object.keys(A.chan).filter(n=>pal.order.indexOf(n)<0).sort())
    .map(n=>Object.assign({c:n},A.chan[n]));
  const mv=o=>metric==="rev"?o.rev:o.units;const mfmt=x=>metric==="rev"?money(x):num(x);
  const prods=Object.values(A.prod).sort((a,b)=>mv(b)-mv(a));
  const top=showAll?prods:prods.slice(0,12);
  const unmatched=Object.keys(A.prod).filter(k=>k&&!byCode[k]);
  const basisNote=basis==="net"?"net of VAT":"incl. VAT";
  function report(){const head=["code","name","units","revenue ("+basisNote+")"].concat(channels.map(c=>c.c+" units"));
    const rows=prods.map(p=>{const nm=byCode[normCode(p.code)];
      return [p.code,nm?nm.name:"",p.units,Math.round(p.rev*100)/100].concat(channels.map(c=>p.ch[c.c]||0));});
    const csv=toCSV(head,rows);if(IN_FRAME||!downloadText("rosa-mystica_sales_"+today()+".csv",csv,"text/csv"))act.openExport("Sales report — CSV",csv);else show("Saved CSV");}
  function monthChart(){ if(!months.length)return html`<div class="empty"><div class="note">No dated sales in this period.</div></div>`;
    const W=720,H=230,padL=54,padR=14,padT=18,padB=28,iw=W-padL-padR,ih=H-padT-padB;
    const maxV=Math.max(1,...months.map(mv));const ticks=niceTicks(maxV,4);let topv=ticks[ticks.length-1];const ts=ticks.length>1?ticks[1]-ticks[0]:topv;while(topv<=maxV){topv+=ts;ticks.push(topv);}
    const step=iw/months.length,bw=Math.min(54,step*0.6),y=v=>padT+ih-(v/topv)*ih;const skip=months.length>18;

      ${ticks.map(t=>html`<g key=${t}><line x1=${padL} x2=${W-padR} y1=${y(t)} y2=${y(t)} style=${{stroke:"var(--line)"}}/><text x=${padL-8} y=${y(t)+3} text-anchor="end" style=${{fontSize:"10.5px",fill:"var(--faint)"}}>${metric==="rev"?Math.round(t):num(t)}</text></g>`)}
      ${months.map((m,i)=>{const cx=padL+step*i+step/2,yy=y(mv(m));const hide=skip&&(i%2);

    </svg>`;}
  function channelChart(){if(!channels.length)return null;const maxV=Math.max(1,...channels.map(mv));
    return html`<div style=${{display:"flex",flexDirection:"column",gap:"13px"}}>${channels.map(c=>html`<div key=${c.c}>
      <div style=${{display:"flex",justifyContent:"space-between",marginBottom:"5px",fontSize:"13px"}}>

  function shareBar(){
    const items=[["In-person",A.modeMap.in_person,"var(--s1)"],["Online",A.modeMap.online,"var(--s2)"]]
      .concat((A.modeMap.unset.units||A.modeMap.unset.rev)?[["Unassigned",A.modeMap.unset,"var(--s3)"]]:[]);

  return html`<div class="content">
    <div class="rowbetween" style=${{marginBottom:"14px"}}><h2 style=${{fontSize:"22px"}}>Sales & analytics</h2>

    ${preset==="custom"?html`<div class="hintrow" style=${{marginBottom:"12px"}}><label class="note">From</label><input type="date" style=${{width:"auto"}} value=${from} onInput=${e=>setFrom(e.target.value)}/><label class="note">to</label><input type="date" style=${{width:"auto"}} value=${to} onInput=${e=>setTo(e.target.value)}/><span class="note">blank = open-ended</span></div>`:null}

    <div class="note" style=${{marginBottom:"14px"}}>Showing <b>${fmtD(start)||"—"}</b> → <b>${fmtD(end)||"—"}</b> · ${num(A.lines)} sale line${A.lines===1?"":"s"} · revenue shown <b>${basisNote}</b></div>

/* VAT helpers — purchase cost carries an explicit per-line rate; sale price is stripped
   by the line's own rate when present, else by the product type's rate from settings. */
function vatRatesOf(st){const v=(st.settings&&st.settings.vatRates)||{};return {book:v.book==null?13.5:+v.book,goods:v.goods==null?25.5:+v.goods,other:v.other==null?0:+v.other};}
function saleRateFor(p,st){const vr=vatRatesOf(st);const t=p&&p.type;if(t&&vr[t]!=null)return vr[t];return vr.goods;}
function netCostUnit(m){const gross=+m.unitPrice||0;const r=m.vatRate==null?null:+m.vatRate;return (r&&r>0)?gross/(1+r/100):gross;}
function netSaleUnit(o,saleRate){const gross=+o.unitPrice||0;const r=o.vatRate==null?null:+o.vatRate;const rate=(r&&r>0)?r:saleRate;return rate>0?gross/(1+rate/100):gross;}
/* Batch transport (freight-in) spread per unit by quantity → added to net landed cost.
   The batch total is taken once per batch (max across its in-lines, so repeating it on every
   row or putting it on one row both work), then divided by the batch's received quantity. */
function batchTransportInfo(st){const q={},t={};
  for(const r of (st.ledger||[])){if(r.dir!=="in")continue;const b=r.batchRef||"";if(!b)continue;q[b]=(q[b]||0)+(+r.qty||0);const tv=r.transport==null?0:(+r.transport||0);if(tv>(t[b]||0))t[b]=tv;}
  const per={},total={};for(const b in t){total[b]=t[b];if(q[b]>0&&t[b]>0)per[b]=t[b]/q[b];}
  return {per,total};}
function computeInventory(st){
  const byCode=indexCatalogue(st.catalogue);const groups={};const tperU=batchTransportInfo(st).per;const km=kindMap(st);
  for(const r of st.ledger){const k=normCode(r.code);if(!k)continue;(groups[k]=groups[k]||[]).push(r);}
  const rows=[];
  for(const k in groups){const mvs=groups[k];const p=byCode[k];const saleRate=saleRateFor(p,st);
    const ins=mvs.filter(m=>m.dir==="in").sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const outs=mvs.filter(m=>m.dir==="out").sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const lots=ins.map(m=>({qty:+m.qty||0,left:+m.qty||0,cost:netCostUnit(m)+(tperU[m.batchRef||""]||0)}));
    const received=lots.reduce((a,l)=>a+l.qty,0);
    let sold=0,shrink=0,cogs=0,shrinkCost=0,revenue=0,revenueNet=0,matchedNetRev=0,unmatched=0;
    /* every out line consumes stock in FIFO order; only a sale line books takings and COGS */
    for(const o of outs){const isSale=isSaleKind(km[o.channel]);const priceGross=+o.unitPrice||0;const priceNet=netSaleUnit(o,saleRate);let q=+o.qty||0;
      if(isSale){sold+=q;revenue+=q*priceGross;revenueNet+=q*priceNet;}else shrink+=q;
      for(const l of lots){if(q<=0)break;if(l.left<=0)continue;const take=Math.min(l.left,q);l.left-=take;q-=take;
        if(isSale){cogs+=take*l.cost;matchedNetRev+=take*priceNet;}else shrinkCost+=take*l.cost;}
      if(q>0&&isSale)unmatched+=q;}
    const onHand=received-sold-shrink;const onHandValue=lots.reduce((a,l)=>a+l.left*l.cost,0);
    const realProfit=matchedNetRev-cogs;const roi=cogs>0?realProfit/cogs:null;
    const lastIn=ins.length?ins[ins.length-1]:null;
    const avgCost=received>0?lots.reduce((a,l)=>a+l.qty*l.cost,0)/received:null;
    rows.push({code:mvs[0].code,name:p?p.name:"",inCat:!!p,sellable:p?p.sellable!==false:true,
      received,sold,shrink,shrinkCost,onHand,unmatched,sellThrough:received>0?sold/received:null,onHandValue,cogs,revenue,revenueNet,realProfit,roi,avgCost,reorderPoint:(p&&p.reorderPoint!=null)?+p.reorderPoint:0,
      provider:(p&&p.supplier)||(lastIn?lastIn.provider:"")||"",providerRef:(p&&p.supplierRef)||(lastIn?lastIn.providerRef:"")||"",lastInDate:lastIn?lastIn.date:""});}
  return rows;
}
/* Per-invoice (batch) progress — FIFO lot→batch attribution from the one ledger. */
function computeBatches(st){
  const byCode=indexCatalogue(st.catalogue);const insBy={},outsBy={};const ti=batchTransportInfo(st);const tperU=ti.per;const ttotal=ti.total;const km=kindMap(st);
  for(const r of st.ledger){const k=normCode(r.code);if(!k)continue;if(r.dir==="in")(insBy[k]=insBy[k]||[]).push(r);else if(r.dir==="out")(outsBy[k]=outsBy[k]||[]).push(r);}
  const agg={},meta={};
  for(const k in insBy){const p=byCode[k];const saleRate=saleRateFor(p,st);
    const ins=insBy[k].slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const outs=(outsBy[k]||[]).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const lots=ins.map(m=>({qty:+m.qty||0,left:+m.qty||0,cost:netCostUnit(m)+(tperU[m.batchRef||""]||0),batchRef:m.batchRef||"(no batch)",date:m.date||"",provider:m.provider||"",country:m.country||""}));
    for(const l of lots){const b=l.batchRef;(agg[b]=agg[b]||{received:0,investedNet:0,sold:0,shrink:0,cogsNet:0,shrinkCost:0,netRev:0});
      agg[b].received+=l.qty;agg[b].investedNet+=l.qty*l.cost;
      const mm=(meta[b]=meta[b]||{date:l.date,provider:l.provider,country:l.country,codes:new Set()});mm.codes.add(k);
      if(l.date&&(!mm.date||l.date<mm.date))mm.date=l.date;if(!mm.provider&&l.provider)mm.provider=l.provider;if(!mm.country&&l.country)mm.country=l.country;}
    for(const o of outs){const isSale=isSaleKind(km[o.channel]);const priceNet=netSaleUnit(o,saleRate);let q=+o.qty||0;
      for(const l of lots){if(q<=0)break;if(l.left<=0)continue;const take=Math.min(l.left,q);l.left-=take;q-=take;const a=agg[l.batchRef];
        if(isSale){a.sold+=take;a.cogsNet+=take*l.cost;a.netRev+=take*priceNet;}else{a.shrink+=take;a.shrinkCost+=take*l.cost;}}}
  }
  const rows=Object.keys(agg).map(b=>{const a=agg[b];const mm=meta[b]||{};const profit=a.netRev-a.cogsNet;
    return {batchRef:b,date:mm.date||"",provider:mm.provider||"",country:mm.country||"",codes:mm.codes?mm.codes.size:0,
      received:a.received,sold:a.sold,shrink:a.shrink,shrinkCost:a.shrinkCost,onHand:a.received-a.sold-a.shrink,sellThrough:a.received>0?a.sold/a.received:null,transport:(ttotal[b]||0),
      investedNet:a.investedNet,recoupedNet:a.netRev,cogsNet:a.cogsNet,profit,roi:a.investedNet>0?profit/a.investedNet:null};});
  rows.sort((x,y)=>(y.date||"").localeCompare(x.date||""));

}

/* Stands in for the whole app when the saved payload cannot be read. While this is on screen

    rd.onerror=()=>setErr("Couldn't read that file.");

        <div class="err">${info.err}</div>

          ${bytes?html`<button class="btn primary" onClick=${dl}><${Icon} name="download"/>Download the raw data</button>`:null}

function App(){

    postInvoice:id=>setSt(s=>{const inv=(s.invoices||[]).find(x=>x.id===id);if(!inv||inv.status==="posted")return s;
      undoRef.current=s;
      const t=invoiceTotals(inv);const rate=parseNum(inv.rate)||1;

  const openProduct=(p,fromStaging)=>setModal({type:"product",editing:p,fromStaging:!!fromStaging});

/* ===================== Finance tab ===================== */
function financeSheets(recs,range,st,grain){
  const r2=x=>x==null?"":Math.round(x*100)/100;
  const agg=financeAgg(recs);const tx=agg.salesPcs+agg.refundPcs;
  const summary=[["Field","Value"],
    ["Period",(range[0]||"")+" … "+(range[1]||"")],["Sale days",agg.days],["Transactions",tx],
    ["Gross (incl VAT)",r2(agg.gross)],["Net (excl VAT)",r2(agg.net)],["VAT",r2(agg.gross-agg.net)],
    ["Average sale",tx?r2(agg.gross/tx):""],["Refund pcs",agg.refundPcs],["Refund total",r2(agg.refundTotal)],["Roundings",r2(agg.roundings)],
    ["Online gross (WooCommerce)",r2(recs.filter(r=>r.mode==="online").reduce((s,r)=>s+(+r.gross||0),0))],["Shipping charged",r2(agg.shippingCharged)],["Postage paid by us",r2((st.postage||[]).filter(e=>(!range[0]||e.date>=range[0])&&(!range[1]||e.date<=range[1])).reduce((s,e)=>s+(+e.amount||0),0))]];
  const rates=Object.keys(agg.vat).sort((a,b)=>(+a)-(+b));
  const vat=[["VAT rate %","Net","VAT","Gross"]].concat(rates.map(rt=>[rt,r2(agg.vat[rt].net),r2(agg.vat[rt].vat),r2(agg.vat[rt].net+agg.vat[rt].vat)]));
  vat.push(["Total",r2(agg.net),r2(agg.gross-agg.net),r2(agg.gross)]);
  const pays=Object.keys(agg.pay);
  const pay=[["Payment method","Pcs","Total"]].concat(pays.map(p=>[p,agg.pay[p].pcs,r2(agg.pay[p].total)]));
  const bks=bucketFinance(recs,grain);
  const byb=[[grain==="month"?"Month":grain==="week"?"Week of":"Date","Gross","Net"]].concat(bks.map(b=>[b.k,r2(b.gross),r2(b.net)]));
  const dhead=["Date","Sale pcs","Sales","Roundings","Refund pcs","Refunds","Gross","Net"].concat(rates.map(rt=>"Net "+rt+"%")).concat(rates.map(rt=>"VAT "+rt+"%")).concat(pays);
  const daily=[dhead].concat(recs.slice().sort((a,b)=>a.date<b.date?-1:1).map(r=>[r.date,r.salesPcs,r2(r.salesTotal),r2(r.roundings),r.refundPcs,r2(r.refundTotal),r2(r.gross),r2(r.net)]
    .concat(rates.map(rt=>r2((r.vat[rt]||{}).net||0))).concat(rates.map(rt=>r2((r.vat[rt]||{}).vat||0))).concat(pays.map(p=>r2((r.pay[p]||{}).total||0)))));
  const inPerson=new Set((st.channels||[]).filter(c=>c.mode==="in_person").map(c=>c.name));
  const led=ledgerSalesInRange(st,range[0],range[1],inPerson);
  const rec=[["Reconciliation (in-person)","Value"],["Till gross (Vektori)",r2(agg.gross)],["Sales recorded in app",r2(led.rev)],["Variance",r2(agg.gross-led.rev)],
    ["Note","Discounts, gift cards and cash-float are not product sales; Vektori product-sales imports date to period end."]];
  const postSheet=[["Date","Amount","Note"]].concat((st.postage||[]).filter(e=>(!range[0]||e.date>=range[0])&&(!range[1]||e.date<=range[1])).sort((a,b)=>a.date<b.date?-1:1).map(e=>[e.date,r2(+e.amount||0),e.note||""]));
  return [{name:"Summary",rows:summary},{name:"By "+grain,rows:byb},{name:"VAT",rows:vat},{name:"Payments",rows:pay},{name:"Daily",rows:daily},{name:"Postage",rows:postSheet},{name:"Reconciliation",rows:rec}];
}
function Finance({st,act,show}){
  const recsAll=(st.finance||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const [tip,setTip]=useState(null);
  const tp=label=>({onMouseEnter:e=>setTip({x:e.clientX,y:e.clientY,label}),onMouseMove:e=>setTip({x:e.clientX,y:e.clientY,label}),onMouseLeave:()=>setTip(null)});
  const [preset,setPreset]=useState("all");const [grain,setGrain]=useState("day");const [from,setFrom]=useState("");const [to,setTo]=useState("");
  const [pf,setPf]=useState(()=>({date:today(),amount:"",note:""}));
  const [chart,setChart]=useState("bars");

function FinanceImportModal({st,act,onClose,show}){
  const [res,setRes]=useState(null);const [err,setErr]=useState("");const [fn,setFn]=useState("");const fileRef=useRef();
  function ingest(rows){const r=parseFinanceRows(rows);setRes(r);if(!r.records.length)setErr(r.warnings[0]||"No daily rows found.");else setErr("");}
  function onFile(e){const f=e.target.files&&e.target.files[0];if(!f)return;setErr("");setRes(null);setFn(f.name);const name=(f.name||"").toLowerCase();const rd=new FileReader();rd.onerror=()=>setErr("Couldn't read the file.");
    if(name.endsWith(".csv")){rd.onload=()=>{try{ingest(csvParse(String(rd.result)));}catch(x){setErr("Couldn't parse that CSV.");}};rd.readAsText(f);}
    else{rd.onload=()=>{try{ingest(xlsxToRows(rd.result));}catch(x){setErr("Couldn't read that .xlsx.");}};rd.readAsArrayBuffer(f);}
    e.target.value="";}
  const prep=res&&res.records.length?prepareFinance(res.records,st):null;
  const agg=res&&res.records.length?financeAgg(res.records):null;
  const ok=prep&&prep.stats.add;
  function run(){if(!ok)return;act.importFinance(prep.add);show("Imported "+prep.stats.add+" settlement day"+(prep.stats.add>1?"s":"")+(prep.stats.dup?" · "+prep.stats.dup+" already in":""));onClose();}
  return html`<${Modal} wide=${true} title="Import settlement — Vektori or WooCommerce" onClose=${onClose}
    footer=${html`<${React.Fragment}><span class="sp"></span><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${run} disabled=${!ok}>Import${ok?(" "+prep.stats.add):""}</button></${React.Fragment}>`}>
    <div class="note">Upload a <b>Vektori Transaction Report</b> (in-person) or a <b>WooCommerce Analytics → Revenue</b> export (online) — .csv or .xlsx, detected automatically. Each day becomes one settlement record on its channel; online money-in is the order total incl. shipping. Re-importing the same days changes nothing (duplicates skipped). The Vektori Settlement Report isn't needed.</div>
    <div class="hintrow"><button class="btn sm" onClick=${()=>fileRef.current&&fileRef.current.click()}><${Icon} name="upload"/>Choose report…</button>
      <input ref=${fileRef} type="file" accept=".csv,.xlsx" style=${{display:"none"}} onChange=${onFile}/>${fn?html`<span class="note">${fn}</span>`:null}
      ${res&&res.records&&res.records.length?html`<span class="badge type">${res.meta&&res.meta.kind==="woo-revenue"?"WooCommerce online":"Vektori in-person"}${res.meta&&res.meta.periodStart?(" · "+fmtD(res.meta.periodStart)+" → "+fmtD(res.meta.periodEnd)):""}</span>`:null}</div>
    ${err?html`<div class="err">${err}</div>`:null}
    ${ok?html`<div class="kpis" style=${{marginTop:"4px"}}>
      <div class="kpi"><div class="k">New days</div><div class="v">${num(prep.stats.add)}</div></div>
      <div class="kpi"><div class="k">Gross</div><div class="v">${money(agg.gross)}</div></div>
      <div class="kpi"><div class="k">Net</div><div class="v">${money(agg.net)}</div></div>
      <div class="kpi"><div class="k">Already in</div><div class="v">${num(prep.stats.dup)}</div></div>
    </div>`:null}
    ${res&&res.warnings&&res.warnings.length?html`<div class="note">${res.warnings.map((w,i)=>html`<div key=${i}>⚠ ${w}</div>`)}</div>`:null}
  </${Modal}>`;}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
